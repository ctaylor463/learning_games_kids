<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thanksgiving Explorer</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thanksgiving">
<meta name="theme-color" content="#F4EFE4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ABeeZee&family=Fredoka:wght@500;600&display=swap">
<style>
/* Minimal inline Leaflet CSS (no mix-blend-mode so regional relief tiles have zero white seam) */
.leaflet-image-layer,.leaflet-layer,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-pane,.leaflet-pane>canvas,.leaflet-pane>svg,.leaflet-tile,.leaflet-tile-container,.leaflet-zoom-box{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#9DC4DC;outline-offset:1px}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-safari .leaflet-tile{image-rendering:-webkit-optimize-contrast}
.leaflet-safari .leaflet-tile-container{width:1600px;height:1600px;-webkit-transform-origin:0 0}
.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-zoom-animated{-webkit-transform-origin:0 0;transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-pan-anim .leaflet-tile,.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-image-layer,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
</style>
<style>
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --ground:#F4EFE4; --card:#FFFFFF; --ink:#222B35; --ink-soft:#5E6A78; --line:#DFD6C3;
  --accent:#C85A27; --accent-soft:#FCE7DA;
  --gold:#D49420; --gold-soft:#FBF0D1;
  --leaf:#35814E; --leaf-soft:#D9EFE0;
  --water:#2E7399; --water-soft:#D7EAF5;
  --amber:#D68C24; --amber-soft:#FBEBD0;
  --shadow:0 4px 0 rgba(34,43,53,.05), 0 8px 24px rgba(34,43,53,.09);
  --f-ui:'Fredoka',ui-rounded,"SF Pro Rounded",'Trebuchet MS',sans-serif;
  --f-read:'ABeeZee','Trebuchet MS','Verdana',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#161B21; --card:#212832; --ink:#EEF1F4; --ink-soft:#A5B0BD; --line:#36414F;
    --accent:#EB7E4B; --accent-soft:#3C281F;
    --gold:#EBB344; --gold-soft:#3A311D;
    --leaf:#5CB879; --leaf-soft:#1E3A2A;
    --water:#63A8CF; --water-soft:#1E3342;
    --amber:#E8A948; --amber-soft:#3F321D;
    --shadow:0 6px 24px rgba(0,0,0,.38);
  }
}
:root[data-theme="dark"]{
  --ground:#161B21; --card:#212832; --ink:#EEF1F4; --ink-soft:#A5B0BD; --line:#36414F;
  --accent:#EB7E4B; --accent-soft:#3C281F;
  --gold:#EBB344; --gold-soft:#3A311D;
  --leaf:#5CB879; --leaf-soft:#1E3A2A;
  --water:#63A8CF; --water-soft:#1E3342;
  --amber:#E8A948; --amber-soft:#3F321D;
  --shadow:0 6px 24px rgba(0,0,0,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-read);font-size:18px;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;touch-action:manipulation;
}
button,a.iconbtn{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-decoration:none}
button:focus-visible,a.iconbtn:focus-visible{outline:3px solid var(--water);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* Shared icon buttons & top strip */
.strip{
  display:flex;align-items:center;gap:12px;
  padding:max(10px,var(--sat)) max(14px,var(--sar)) 8px max(14px,var(--sal));
  min-height:74px;flex:none;
}
.iconbtn,.gate{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);box-shadow:var(--shadow);border:1.5px solid var(--line);
  position:relative;flex:none;transition:transform .12s ease;
}
.iconbtn:active,.gate:active{transform:scale(.95)}
.iconbtn svg,.gate svg{width:25px;height:25px;position:relative}
.iconbtn.small{width:44px;height:44px}
.iconbtn.small svg{width:22px;height:22px}
.iconbtn.on-state{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.iconbtn[data-label],.gate[data-label]{margin-bottom:18px}
.iconbtn[data-label]::after,.gate[data-label]::after{
  content:attr(data-label);position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);
  font-family:var(--f-ui);font-weight:600;font-size:12px;line-height:1;color:var(--ink-soft);white-space:nowrap;
}
.gate{overflow:visible}
.gate .clip{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.gate .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--gold-soft)}
.standalone [data-fs-btn]{display:none}
:root.iosfs{--sat:calc(env(safe-area-inset-top, 0px) + 50px)}

/* Progress track */
.track-wrap{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.track{
  flex:1;height:34px;border-radius:17px;background:var(--card);
  border:2px solid var(--line);position:relative;overflow:hidden;
}
.track-fill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,var(--gold-soft),var(--accent-soft));
  transition:width .4s ease;
}
.track-leaf{
  position:absolute;left:4%;top:50%;transform:translate(-50%,-50%);
  width:26px;height:26px;transition:left .4s ease;z-index:2;
}
.track-count{
  font-family:var(--f-ui);font-weight:600;font-size:16px;color:var(--ink-soft);
  white-space:nowrap;min-width:48px;text-align:right;font-variant-numeric:tabular-nums;
}

/* Home screen (clean 2-game layout, kid-friendly copy) */
.home{
  flex:1;display:flex;flex-direction:column;
  padding:max(12px,var(--sat)) max(20px,var(--sar)) max(16px,var(--sab)) max(20px,var(--sal));
  gap:18px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  max-width:1020px;width:100%;margin:0 auto;
}
.hometop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-family:var(--f-ui);font-weight:600;font-size:clamp(26px,4.5vw,38px);line-height:1.1}
.brand small{display:block;font-family:var(--f-read);font-weight:400;font-size:16px;color:var(--ink-soft);margin-top:4px}
.top-actions{display:flex;gap:12px;align-items:flex-start}

.game-cards{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;min-height:0;align-content:center;
}
@media (max-width:720px){.game-cards{grid-template-columns:1fr;align-content:start}}
.gcard{
  background:var(--card);border-radius:26px;box-shadow:var(--shadow);
  border:3px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;text-align:left;
  transition:transform .14s ease,border-color .16s ease;
}
.gcard:active{transform:scale(.98)}
@media (hover:hover){.gcard:hover{border-color:var(--accent);transform:translateY(-2px)}}
.gcard-img{
  width:100%;aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--line);
}
.gcard-img img{width:100%;height:100%;object-fit:cover;display:block}
.gcard-pill{
  position:absolute;top:12px;left:12px;
  background:rgba(24,30,38,.78);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:5px 12px;border-radius:999px;font-family:var(--f-ui);font-size:13px;font-weight:600;
}
.gcard-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard-body b{font-family:var(--f-ui);font-size:clamp(24px,3vw,28px);font-weight:600;line-height:1.15}
.gcard-body span{font-size:16px;color:var(--ink-soft);line-height:1.38}
.gcard-meta{
  margin-top:auto;padding-top:10px;font-family:var(--f-ui);font-size:14px;color:var(--accent);font-weight:600;
}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:2px}
.home-stats{font-size:15px;color:var(--ink-soft)}

/* QUIZ PLAY SCREEN */
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px max(18px,var(--sar)) 8px max(18px,var(--sal));
  min-height:0;gap:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  width:100%;max-width:960px;margin:0 auto;
}
.q-hero{
  width:100%;background:var(--card);border-radius:24px;box-shadow:var(--shadow);
  border:4px solid var(--line);overflow:hidden;
  display:grid;grid-template-columns:minmax(250px,370px) 1fr;align-items:stretch;
  transition:border-color .25s;
}
.q-hero.ok{border-color:var(--leaf)}
.q-hero.oops{border-color:var(--amber)}
.q-photo{
  position:relative;min-height:220px;overflow:hidden;background:#232A33;
}
.q-photo img{width:100%;height:100%;object-fit:cover;display:block}
.q-photo.portrait::before{
  content:"";position:absolute;inset:-24px;background:var(--bg) center/cover;filter:blur(18px);opacity:.55;
}
.q-photo.portrait img{position:relative;object-fit:contain}
.q-caption{
  position:absolute;left:0;right:0;bottom:0;padding:18px 12px 7px;
  background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;
  font-size:12px;line-height:1.25;
}
/* Stack cleanly on portrait tablets and narrow screens */
@media (max-width:740px), (max-width:920px) and (orientation:portrait){
  .q-hero{grid-template-columns:1fr}
  .q-photo{height:270px;min-height:210px}
}
.q-text-wrap{
  padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative;
}
.q-tag{
  display:inline-flex;align-self:flex-start;font-family:var(--f-ui);font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:999px;
  background:var(--gold-soft);color:var(--accent);
}
.q-tag.bio{background:var(--leaf-soft);color:var(--leaf)}
.q-tag.sea{background:var(--water-soft);color:var(--water)}
.q-question{font-size:clamp(19px,2.7vw,24px);line-height:1.32;margin:0}
.q-fact{
  margin-top:6px;padding:10px 14px;border-radius:14px;background:var(--leaf-soft);
  border:2px solid var(--leaf);font-size:clamp(15px,2.1vw,17px);line-height:1.38;
  animation:popIn .24s ease-out;
}
.q-fact b{font-family:var(--f-ui);color:var(--leaf)}

/* Choice buttons with integrated tap-to-hear icon for emerging readers (4-6) */
.choices{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;
}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice-wrap{
  display:flex;align-items:stretch;background:var(--card);border:3.5px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-height:76px;
  transition:transform .12s,border-color .18s,background .18s,opacity .18s;
}
.choice-wrap:active{transform:scale(.98)}
.choice-wrap.glow{border-color:var(--leaf);background:var(--leaf-soft)}
.choice-wrap.hint{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.choice-wrap.speaking{border-color:var(--water);box-shadow:0 0 0 4px var(--water-soft)}
.choice-wrap.dim{opacity:.33;pointer-events:none}
.choice-main{
  flex:1;padding:14px 12px 14px 16px;display:flex;align-items:center;justify-content:center;gap:10px;
  text-align:center;font-family:var(--f-ui);font-size:clamp(17px,2.3vw,21px);font-weight:600;line-height:1.22;
}
.choice-main .bin-ico{width:26px;height:26px;flex:none;display:grid;place-items:center}
.choice-say{
  width:50px;flex:none;display:grid;place-items:center;color:var(--water);
  border-left:1.5px solid var(--line);background:rgba(46,115,153,.06);
}
.choice-say:active{background:var(--water-soft)}
.choice-say svg{width:22px;height:22px}

/* Bottom bar */
.bar{
  display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px max(16px,var(--sar)) max(14px,var(--sab)) max(16px,var(--sal));
  min-height:76px;flex:none;
}
.act{
  height:56px;min-width:132px;padding:0 22px;border-radius:28px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--f-ui);font-weight:600;font-size:19px;box-shadow:var(--shadow);
  transition:transform .12s;
}
.act:active{transform:scale(.96)}
.act svg{width:23px;height:23px}
.act.plain{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.act.go{background:var(--accent);color:#fff;min-width:180px}
.act[disabled]{opacity:.35;pointer-events:none}

/* REAL LEAFLET MAP PLAY SCREEN */
.map-shell{
  flex:1;position:relative;min-height:0;overflow:hidden;
}
#lmap{position:absolute;inset:0;width:100%;height:100%}
.map-hud{
  position:absolute;top:12px;left:max(12px,var(--sal));right:max(12px,var(--sar));
  max-width:590px;z-index:900;pointer-events:auto;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:2.5px solid var(--line);border-radius:20px;padding:11px 15px;
  box-shadow:0 8px 24px rgba(20,28,38,.22);color:#222B35;
}
:root[data-theme="dark"] .map-hud{background:rgba(33,40,50,.95);color:#EEF1F4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .map-hud{background:rgba(33,40,50,.95);color:#EEF1F4}}
.map-hud.ok{border-color:var(--leaf)}
.map-hud.oops{border-color:var(--amber)}
.map-hud.compact{max-width:max-content;padding:8px 13px}
.map-hud-q{font-size:clamp(16px,2.2vw,19.5px);line-height:1.3;margin:5px 0 0}

/* Iconized Oregon Trail Voyage Log bar */
.voyage-log{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px;padding-top:7px;
  border-top:1.5px solid var(--line);font-family:var(--f-ui);font-size:13px;font-weight:600;
}
.map-hud.compact .voyage-log{margin-top:0;padding-top:0;border-top:0}
.vlog-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:#5A3810;
  font-variant-numeric:tabular-nums;
}
.vlog-chip svg{width:14px;height:14px;flex:none}
.vlog-chip.sea{background:var(--water-soft);color:#1E4E6D}
.vlog-chip.ok{background:var(--leaf-soft);color:#1E5B32}
:root[data-theme="dark"] .vlog-chip{color:#FBF0D1}
:root[data-theme="dark"] .vlog-chip.sea{color:#CBE6F5}
:root[data-theme="dark"] .vlog-chip.ok{color:#C6EDD2}

.map-tools{
  position:absolute;top:12px;right:max(12px,var(--sar));z-index:910;
  display:flex;gap:8px;
}
.map-tool-btn{
  background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:8px 13px;font-family:var(--f-ui);font-weight:600;font-size:14px;
  box-shadow:var(--shadow);color:var(--ink);white-space:nowrap;
}
.map-tool-btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:740px){.map-hud{top:56px}}

/* Map photo postcard overlay after answering */
.map-card{
  position:absolute;left:max(12px,var(--sal));right:max(12px,var(--sar));bottom:12px;
  max-width:780px;margin:0 auto;z-index:920;
  background:var(--card);border:3px solid var(--leaf);border-radius:22px;
  box-shadow:0 12px 32px rgba(20,28,38,.32);overflow:hidden;
  display:grid;grid-template-columns:220px 1fr;align-items:stretch;
  animation:popIn .25s ease-out;
}
@media (max-width:640px){.map-card{grid-template-columns:1fr}.map-card-img{max-height:140px}}
.map-card-img{position:relative;min-height:145px;background:#232A33;overflow:hidden}
.map-card-img img{width:100%;height:100%;object-fit:cover;display:block}
.map-card-body{padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.map-card-body b{font-family:var(--f-ui);font-size:21px;color:var(--leaf)}
.map-card-body p{margin:0;font-size:16px;line-height:1.36}

/* Oregon Trail Mid-Ocean & Colony Survival Decision Card */
.sea-event{
  position:absolute;left:max(12px,var(--sal));right:max(12px,var(--sar));bottom:12px;
  max-width:860px;margin:0 auto;z-index:930;
  background:var(--card);border:3.5px solid var(--water);border-radius:24px;
  box-shadow:0 14px 36px rgba(14,26,38,.36);overflow:hidden;
  display:grid;grid-template-columns:230px 1fr;align-items:stretch;
  animation:popIn .28s ease-out;
}
.sea-event.colony-card{border-color:var(--accent)}
@media (max-width:700px){.sea-event{grid-template-columns:1fr}.se-img{max-height:135px}}
.se-img{position:relative;min-height:165px;background:#1A2735;overflow:hidden}
.se-img img{width:100%;height:100%;object-fit:cover;display:block}
.se-badge{
  position:absolute;top:10px;left:10px;background:rgba(20,34,48,.82);color:#FBF0D1;
  padding:4px 10px;border-radius:999px;font-family:var(--f-ui);font-size:12px;font-weight:600;
}
.se-body{padding:13px 15px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.se-title{font-family:var(--f-ui);font-size:19.5px;font-weight:600;color:var(--water);margin:0}
.sea-event.colony-card .se-title{color:var(--accent)}
.se-desc{margin:0;font-size:15px;line-height:1.34}
.se-opts{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.se-opt-row{
  display:flex;align-items:stretch;border-radius:14px;overflow:hidden;
  background:var(--ground);border:2.5px solid var(--line);
  transition:transform .1s,border-color .16s,background .16s,opacity .16s;
}
.se-opt-row.glow{border-color:var(--leaf);background:var(--leaf-soft)}
.se-opt-row.speaking{border-color:var(--water);box-shadow:0 0 0 3px var(--water-soft)}
.se-opt-row.dim{opacity:.36;pointer-events:none}
.se-opt-btn{
  flex:1;text-align:left;padding:9px 12px;
  font-family:var(--f-ui);font-size:15px;font-weight:600;line-height:1.24;
}
.se-opt-say{
  width:44px;flex:none;display:grid;place-items:center;color:var(--water);
  border-left:1.5px solid var(--line);background:rgba(46,115,153,.06);
}
.se-opt-say svg{width:19px;height:19px}
.se-outcome{
  padding:9px 12px;border-radius:13px;background:var(--leaf-soft);border:2px solid var(--leaf);
  font-size:14.5px;line-height:1.34;animation:popIn .2s ease-out;
}
.se-outcome.warn{background:var(--amber-soft);border-color:var(--amber)}

/* Custom Leaflet pins */
.tg-pin{
  width:34px;height:34px;border-radius:50%;background:#C85A27;border:3px solid #FFFFFF;
  box-shadow:0 3px 10px rgba(0,0,0,.38);display:grid;place-items:center;
  position:relative;transition:transform .16s ease,opacity .2s ease;
}
.tg-pin::after{content:'';width:9px;height:9px;border-radius:50%;background:#FFFFFF}
.tg-pin.done{background:#35814E}
.tg-pin.done::after{width:12px;height:12px;border-radius:0;background:none;border-right:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(45deg) translate(-1px,-2px)}
.tg-pin.dim{opacity:.32}
.tg-pin.hint{background:#D49420;box-shadow:0 0 0 8px rgba(212,148,32,.42);animation:pinPulse 1s ease-in-out infinite}
.tg-lbl{
  position:absolute;left:50%;top:-27px;transform:translateX(-50%);
  white-space:nowrap;background:rgba(255,255,255,.96);color:#222B35;
  padding:2px 9px;border-radius:999px;font-family:var(--f-ui);font-size:12.5px;font-weight:600;
  border:1.5px solid #D8CEBC;box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none;
}
.tg-lbl.below{top:auto;bottom:-27px}
.tg-lbl.left{left:auto;right:40px;top:50%;transform:translateY(-50%)}
.tg-lbl.right{left:40px;top:50%;transform:translateY(-50%)}
.labels-off .tg-pin:not(.done):not(.hint) .tg-lbl{display:none}

/* Animated Mayflower Sailing Ship */
.ship-icon{
  width:64px;height:64px;position:relative;pointer-events:none;
  filter:drop-shadow(0 5px 8px rgba(15,28,42,.42));
}
.ship-bob{width:100%;height:100%;animation:shipRock 2.4s ease-in-out infinite}
.ship-sailing .ship-bob{animation:shipSail .7s ease-in-out infinite}
.ship-wake{
  position:absolute;right:-10px;bottom:14px;width:24px;height:10px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.85),rgba(255,255,255,0));
  opacity:0;transition:opacity .3s;
}
.ship-sailing .ship-wake{opacity:1}
@keyframes shipRock{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes shipSail{0%,100%{transform:translateY(0) rotate(-4deg) scale(1.04)}50%{transform:translateY(-4px) rotate(3deg) scale(1.07)}}

@keyframes pinPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes popIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .34s ease}

/* End screen */
.center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:24px;text-align:center;max-width:720px;margin:0 auto;width:100%;
}
.center h1{font-family:var(--f-ui);font-weight:600;font-size:clamp(28px,5vw,38px);margin:0}
.center p{margin:0;color:var(--ink-soft);font-size:18px;max-width:36ch;line-height:1.4}
.end-photo{
  width:min(86vw,380px);aspect-ratio:16/10;border-radius:22px;overflow:hidden;
  border:4px solid var(--gold);box-shadow:var(--shadow);
}
.end-photo img{width:100%;height:100%;object-fit:cover;display:block}
.summary-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:600px}
.summary-chip{
  background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:6px 14px;font-family:var(--f-ui);font-size:15px;
}

/* Grown-ups screen */
.parent{flex:1;display:flex;flex-direction:column;min-height:0;-webkit-user-select:text;user-select:text;max-width:920px;width:100%;margin:0 auto}
.tabs{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto}
.tab{font-family:var(--f-ui);font-weight:600;font-size:16px;padding:10px 18px;border-radius:999px;background:var(--card);color:var(--ink-soft);white-space:nowrap;border:1.5px solid var(--line)}
.tab.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pane{display:none;flex:1;overflow-y:auto;padding:0 18px 32px;min-height:0}
.pane.on{display:block}
.pane h2{font-family:var(--f-ui);font-weight:600;font-size:22px;margin:16px 0 8px}
.pane h3{font-family:var(--f-ui);font-weight:600;font-size:14px;margin:18px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.pane p,.pane li{font-size:16px;line-height:1.5;max-width:66ch}
.pane table{border-collapse:collapse;width:100%;max-width:720px;font-size:15px;font-variant-numeric:tabular-nums}
.pane th,.pane td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.pane th{font-family:var(--f-ui);font-weight:600;color:var(--ink-soft);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.pbtn{
  font-family:var(--f-ui);font-weight:600;font-size:16px;padding:11px 18px;border-radius:14px;
  background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);margin:4px 6px 4px 0;min-height:46px;
}
.pbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pbtn.warn{background:var(--amber);color:#1E1A14;border-color:var(--amber)}
.field{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
  background:var(--ink);color:var(--ground);padding:12px 20px;border-radius:14px;
  font-family:var(--f-ui);font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:90vw;z-index:1200;text-align:center;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.track-fill,.track-leaf{transition:none}.tg-pin.hint,.ship-bob{animation:none}}
</style>
</head>

<script src="../lib/leaflet-1.9.4.min.js"></script>
<script>
// ==================== ICONS ====================
const ICONS = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5h4v5"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  voiceOn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
  voiceOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>',
  listVoice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h8M4 18h10"/><path d="M17 9l4 3-4 3V9Z"/></svg>',
  fullscreen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>',
  fullscreenExit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M10 10H4m6 0V4m0 6L3 3m11 7h6m-6 0V4m0 6l7-7"/></svg>',
  yesIco:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#D9EFE0" stroke="#35814E" stroke-width="2"/><path d="M7.5 12.5 10.5 15.5 16.5 9" stroke="#35814E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  noIco:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#FCE7DA" stroke="#C85A27" stroke-width="2"/><path d="M9 9l6 6M15 9l-6 6" stroke="#C85A27" stroke-width="2.6" stroke-linecap="round"/></svg>',
  calMini:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg>',
  compMini:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><polygon points="8,4 10,8 8,12 6,8" fill="currentColor" stroke="none"/></svg>',
  flagMini:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2.5v11.5"/><path d="M3.5 3h8l-1.5 3 1.5 3h-8"/></svg>',
  leaf:'<svg viewBox="0 0 36 36"><path d="M18 4 L15 11 L9 9 L12 16 L6 19 L14 23 L13 28 L18 25 L23 28 L22 23 L30 19 L24 16 L27 9 L21 11 Z" fill="#C85A27" stroke="#7A2D18" stroke-width="1.4" stroke-linejoin="round"/><path d="M18 14 V33" stroke="#7A2D18" stroke-width="2" stroke-linecap="round"/></svg>',
  ship:`<svg viewBox="0 0 64 64" width="64" height="64">
    <path d="M10 53 Q19 49 28 53 T46 53 T58 53" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
    <path d="M10 42 L54 42 L48 52 L17 52 Z" fill="#7D4920" stroke="#3D220D" stroke-width="2" stroke-linejoin="round"/>
    <path d="M44 37 L55 37 L54 42 L44 42 Z" fill="#9A5C2B" stroke="#3D220D" stroke-width="1.8"/>
    <path d="M16 46 H48" stroke="#D9A76A" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="24" y1="14" x2="24" y2="42" stroke="#3D220D" stroke-width="2.4"/>
    <line x1="38" y1="10" x2="38" y2="42" stroke="#3D220D" stroke-width="2.6"/>
    <path d="M14 19 Q21 25 14 36 L28 36 Q33 25 28 19 Z" fill="#FFFDF4" stroke="#B6A587" stroke-width="1.6"/>
    <path d="M29 14 Q36 23 29 37 L45 37 Q51 23 45 14 Z" fill="#FFFDF4" stroke="#B6A587" stroke-width="1.6"/>
    <path d="M38 10 L27 7 L38 5 Z" fill="#C85A27"/>
    <path d="M24 14 L16 12 L24 10 Z" fill="#C85A27"/>
  </svg>`
};

// ==================== STATE ====================
const KEY = 'thanksgiving-explorer-v4';
const DEFAULT = {
  v: 4,
  settings: { autoRead: true, sfx: true, theme: 'auto', mapLabels: true },
  stats: { quiz: { rounds: 0, n: 0, ok: 0 }, map: { rounds: 0, n: 0, ok: 0 } },
  seenQuiz: {},
  seenMap: {}
};
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      return {
        ...DEFAULT, ...o,
        settings: { ...DEFAULT.settings, ...(o.settings || {}) },
        stats: {
          quiz: { ...DEFAULT.stats.quiz, ...(o.stats?.quiz || {}) },
          map: { ...DEFAULT.stats.map, ...(o.stats?.map || {}) }
        },
        seenQuiz: { ...(o.seenQuiz || {}) },
        seenMap: { ...(o.seenMap || {}) }
      };
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function applyTheme() {
  if (S.settings.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', S.settings.theme);
}
applyTheme();

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms || 2400); }
function clearToast() { clearTimeout(toast.t); $('toast').classList.remove('on'); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon] || ''; });
$('q-leaf').innerHTML = ICONS.leaf;
$('m-leaf').innerHTML = ICONS.leaf;

// ==================== FULL SCREEN ====================
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const HOME_TIP = 'For full screen, tap Share, then Add to Home Screen, and open the games from that icon.';
const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const canFullscreen = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function updateFsButtons() {
  const active = isFullscreen(), k = active ? 'fullscreenExit' : 'fullscreen';
  document.querySelectorAll('[data-fs-btn]').forEach(btn => {
    const s = btn.querySelector('[data-icon]');
    if (s) { s.dataset.icon = k; s.innerHTML = ICONS[k]; }
    btn.dataset.label = active ? 'Exit' : 'Full screen';
  });
}
async function toggleFullscreen() {
  if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) { toast('Already running full screen from Home Screen.'); return; }
  if (IOS && !isFullscreen() && !canFullscreen()) { toast(HOME_TIP, 6500); return; }
  try {
    if (isFullscreen()) { if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) await document.webkitExitFullscreen(); }
    else { const el = document.documentElement; if (el.requestFullscreen) await el.requestFullscreen(); else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen(); else toast(IOS ? HOME_TIP : 'Full screen not available.', IOS ? 6500 : 2400); }
  } catch (e) { toast(IOS ? HOME_TIP : 'Full screen not available.', IOS ? 6500 : 2400); }
  updateFsButtons();
}
if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) document.body.classList.add('standalone');
function onFsChange() { document.documentElement.classList.toggle('iosfs', IOS && isFullscreen()); updateFsButtons(); }
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.querySelectorAll('[data-fs-btn]').forEach(b => b.addEventListener('click', toggleFullscreen));

// ==================== REALISTIC NEURAL VOICE + OPTION READER + CHIMES ====================
let audioCtx = null;
function ensureAudio() {
  if (!S.settings.sfx) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}
function tone(freq, dur, delay, type, vol) {
  const ctx = ensureAudio(); if (!ctx) return;
  try {
    const t0 = ctx.currentTime + (delay || 0);

const voicePlayer = new Audio();
voicePlayer.preload = 'auto';
let speechSeq = 0;
let primed = false;
function primeAudio() {
  if (primed) return;
  primed = true;
  ensureAudio();
  try {
    voicePlayer.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
    voicePlayer.play().then(() => voicePlayer.pause()).catch(() => {});
  } catch (e) {}
}
['pointerdown', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, primeAudio, { capture: true, passive: true }));

function clearSpeakingHighlight() {
  document.querySelectorAll('.speaking').forEach(x => x.classList.remove('speaking'));
}

function stopVoice() {
  speechSeq++;
  clearSpeakingHighlight();
  try { voicePlayer.pause(); voicePlayer.currentTime = 0; } catch (e) {}
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
}

function speakTextPromise(text) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) return res();
    let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    try {
      const vs = speechSynthesis.getVoices() || [];
      const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
      const best = en.find(v => /Ava|Zoe|Emma|Andrew|Samantha|Allison|Premium|Enhanced|Natural/i.test(v.name)) || en[0] || vs[0];
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.92;
      if (best) u.voice = best;
      u.onend = fin; u.onerror = fin;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      setTimeout(fin, 1800 + text.length * 85);
    } catch (e) { fin(); }
  });
}

function playVoice(clipId, fallbackText, force) {
  if (!force && !S.settings.autoRead) return;
  const mySeq = ++speechSeq;
  clearSpeakingHighlight();
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  if (!clipId) { speakTextPromise(fallbackText); return; }
  voicePlayer.onended = null;
  voicePlayer.onerror = () => { if (mySeq === speechSeq) speakTextPromise(fallbackText); };
  voicePlayer.src = `audio/${clipId}.mp3`;
  const p = voicePlayer.play();
  if (p && p.catch) p.catch(() => { if (mySeq === speechSeq && force) speakTextPromise(fallbackText); });
}

// Reads a list of visible choice elements sequentially while highlighting each button (great for 4-6 year olds!)
async function readChoicesSequentially(rowSelector, textGetter) {
  const mySeq = ++speechSeq;
  try { voicePlayer.pause(); } catch (e) {}
  const rows = [...document.querySelectorAll(rowSelector)].filter(r => !r.classList.contains('dim'));
  for (const r of rows) {
    if (mySeq !== speechSeq) break;
    clearSpeakingHighlight();
    r.classList.add('speaking');
    await speakTextPromise(textGetter(r));
    if (mySeq !== speechSeq) break;
    await new Promise(res => setTimeout(res, 180));
  }
  clearSpeakingHighlight();
}

function updateVoiceButtons() {
  const on = !!S.settings.autoRead;
  ['btn-home-voice', 'btn-quiz-voice', 'btn-map-voice'].forEach(id => {
    const b = $(id); if (!b) return;
    b.classList.toggle('on-state', on);
    b.dataset.label = on ? 'Voice on' : 'Voice off';
    const sp = b.querySelector('[data-icon]');
    if (sp) sp.innerHTML = on ? ICONS.voiceOn : ICONS.voiceOff;
  });
}
function toggleVoice() {
  S.settings.autoRead = !S.settings.autoRead;
  save(); updateVoiceButtons();
  if (!S.settings.autoRead) stopVoice();
  toast(S.settings.autoRead ? 'Voice read-aloud is on.' : 'Voice read-aloud is off.');
}

function pointerHold(el, ms, onDone, fillEl, onShort) {
  let t = null, startT = 0, raf = null;
  const stop = () => { clearTimeout(t); t = null; if (raf) cancelAnimationFrame(raf); if (fillEl) fillEl.style.height = '0'; };
  const tick = () => { if (!t) return; const p = Math.min(1, (Date.now() - startT) / ms); if (fillEl) fillEl.style.height = (p * 100) + '%'; raf = requestAnimationFrame(tick); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); startT = Date.now(); t = setTimeout(() => { stop(); onDone(); }, ms); tick(); });
  el.addEventListener('pointerup', () => { if (t && onShort) onShort(); stop(); });
  ['pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
}

// ==================== GAME 1: THANKSGIVING QUIZ ====================
const Q = { items: [], i: 0, tries: 0, busy: false, ok: 0, chips: [], curClip: '', curText: '' };

function pickFresh(pool, seenObj, count) {
  const sorted = shuffle(pool).sort((a, b) => (seenObj[a.id] || 0) - (seenObj[b.id] || 0));
  return shuffle(sorted.slice(0, count));
}

function setTrack(prefix, idx, total) {
  const f = total > 0 ? idx / total : 0;
  $(prefix + '-fill').style.width = (f * 100) + '%';
  $(prefix + '-leaf').style.left = (4 + 92 * Math.min(1, f)) + '%';
  $(prefix + '-count').textContent = `${Math.min(idx + 1, total)} / ${total}`;
}

function startQuiz() {
  stopVoice(); clearToast();
  Q.items = pickFresh(QUIZ_ITEMS, S.seenQuiz, 10);
  Q.i = 0; Q.ok = 0; Q.chips = [];
  show('s-quiz');
  renderQuizStep();
}

function renderQuizBar(showNext) {
  $('q-bar').innerHTML =
    `<button class="act plain" id="q-hear">${ICONS.voiceOn}Hear it</button>` +
    (!showNext ? `<button class="act plain" id="q-read-opts">${ICONS.listVoice}Read choices</button>` : '') +
    (showNext ? `<button class="act go" id="q-next">${Q.i === Q.items.length - 1 ? 'Finish' : 'Next'}${ICONS.next}</button>` : '');
  $('q-hear').addEventListener('click', () => { sfxPop(); playVoice(Q.curClip, Q.curText, true); });
  if ($('q-read-opts')) {
    $('q-read-opts').addEventListener('click', () => {
      sfxPop();
      readChoicesSequentially('#q-choices .choice-wrap', r => r.dataset.v);
    });
  }
  if (showNext) {
    $('q-next').addEventListener('click', () => {
      sfxPop(); stopVoice(); clearToast();
      Q.i++;
      if (Q.i >= Q.items.length) finishRound('quiz', Q.ok, Q.items.length, Q.chips, 'img/roast_turkey.jpg');
      else renderQuizStep();
    });
  }
}

function binIconFor(opt) {
  if (/^(True|Yes)/i.test(opt)) return `<span class="bin-ico">${ICONS.yesIco}</span>`;
  if (/^(False|No)/i.test(opt)) return `<span class="bin-ico">${ICONS.noIco}</span>`;
  return '';
}

function renderQuizStep() {
  const item = Q.items[Q.i];
  Q.tries = 0; Q.busy = false;
  Q.curClip = 'q_' + item.id; Q.curText = item.q;
  setTrack('q', Q.i, Q.items.length);
  const opts = item.opts.length === 2 ? item.opts.slice() : shuffle(item.opts);

  $('q-stage').innerHTML = `
    <div class="q-hero" id="q-hero">
      <div class="q-photo ${item.portrait ? 'portrait' : ''}" ${item.portrait ? `style="--bg:url('${item.img}')"` : ''}>
        <img src="${item.img}" alt="${item.cap}">
        <div class="q-caption">${item.cap}</div>
      </div>
      <div class="q-text-wrap">
        <span class="q-tag ${item.tagCls || ''}">${item.tag}</span>
        <p class="q-question">${item.q}</p>
        <div id="q-fact-slot"></div>
      </div>
    </div>
    <div class="choices" id="q-choices">
      ${opts.map(o => `<div class="choice-wrap" data-v="${o.replace(/"/g, '&quot;')}">
        <button class="choice-main">${item.binary ? binIconFor(o) : ''}<span>${o}</span></button>
        <button class="choice-say" aria-label="Read choice aloud" title="Hear this choice">${ICONS.voiceOn}</button>
      </div>`).join('')}
    </div>
  `;
  renderQuizBar(false);
  playVoice(Q.curClip, Q.curText, false);

  document.querySelectorAll('#q-choices .choice-wrap').forEach(wrap => {
    // Tap speaker icon on right of any option to hear just that option (ideal for 4-6 year old pre-readers)
    wrap.querySelector('.choice-say').addEventListener('click', e => {
      e.stopPropagation();
      if (wrap.classList.contains('dim')) return;
      stopVoice();
      sfxPop();
      wrap.classList.add('speaking');
      speakTextPromise(wrap.dataset.v).then(() => wrap.classList.remove('speaking'));
    });

    wrap.querySelector('.choice-main').addEventListener('click', () => {
      if (Q.busy || wrap.classList.contains('dim')) return;
      if (wrap.dataset.v === item.answer) {
        Q.busy = true;
        clearToast();
        stopVoice();
        sfxOk();
        S.stats.quiz.n++;
        if (Q.tries === 0) { S.stats.quiz.ok++; Q.ok++; }
        S.seenQuiz[item.id] = Date.now();
        save();
        wrap.classList.remove('hint');
        wrap.classList.add('glow');
        document.querySelectorAll('#q-choices .choice-wrap').forEach(x => { if (x !== wrap) x.classList.add('dim'); });
        $('q-hero').classList.remove('oops');
        $('q-hero').classList.add('ok');
        $('q-fact-slot').innerHTML = `<div class="q-fact"><b>${item.answer}:</b> ${item.fact}</div>`;
        Q.chips.push(item.chip || item.answer);
        Q.curClip = 'f_' + item.id; Q.curText = item.fact;
        renderQuizBar(true);
        playVoice(Q.curClip, Q.curText, false);
      } else {
        Q.tries++;
        sfxOops();
        wrap.classList.add('dim', 'shake');
        setTimeout(() => wrap.classList.remove('shake'), 360);
        $('q-hero').classList.add('oops');
        if (Q.tries >= 1 && opts.length > 2) {
          toast('Try another answer.');
          if (Q.tries >= 2) {
            const rightWrap = [...document.querySelectorAll('#q-choices .choice-wrap')].find(x => x.dataset.v === item.answer);
            if (rightWrap) rightWrap.classList.add('hint');
          }
        } else {
          const rightWrap = [...document.querySelectorAll('#q-choices .choice-wrap')].find(x => x.dataset.v === item.answer);
          if (rightWrap) rightWrap.classList.add('hint');
        }
      }
    });
  });
}

    fetch('../map_us/states_hi.json').then(r => r.ok ? r.json() : null).then(gj => {
      if (gj) {
        usBordersLayer = L.geoJSON(gj, { style: { color: '#4B3A26', weight: 1.1, opacity: 0.62, fill: false }, interactive: false });
        updateBordersForView();
      }
    }).catch(() => {});
  }

  mapRouteLayer = L.layerGroup().addTo(lmap);
  mapTrailLayer = L.layerGroup().addTo(lmap);
  mapPinsLayer = L.layerGroup().addTo(lmap);

  L.polyline(FULL_ROUTE.slice(1), { color: '#FFFFFF', weight: 4.5, dashArray: '8 8', opacity: 0.55, interactive: false }).addTo(mapRouteLayer);
  L.polyline(FULL_ROUTE.slice(1), { color: '#C85A27', weight: 2.5, dashArray: '8 8', opacity: 0.85, interactive: false }).addTo(mapRouteLayer);

  const shipIcon = L.divIcon({
    className: '',
    html: `<div class="ship-icon" id="ship-el"><div class="ship-wake"></div><div class="ship-bob">${ICONS.ship}</div></div>`,
    iconSize: [64, 64],
    iconAnchor: [32, 42]
  });
  shipMarker = L.marker([48.6, -7.8], { icon: shipIcon, zIndexOffset: 500, interactive: false }).addTo(mapRouteLayer);
}

// Hide coarse vector outlines in high-res massbay close-up so relief coastlines stay razor-clean
function updateBordersForView() {
  if (!lmap) return;
  const showVec = M.viewKey !== 'massbay';
  if (worldBordersLayer) {
    if (showVec && !lmap.hasLayer(worldBordersLayer)) worldBordersLayer.addTo(lmap);
    else if (!showVec && lmap.hasLayer(worldBordersLayer)) lmap.removeLayer(worldBordersLayer);
  }
  if (usBordersLayer) {
    if (showVec && !lmap.hasLayer(usBordersLayer)) usBordersLayer.addTo(lmap);
    else if (!showVec && lmap.hasLayer(usBordersLayer)) lmap.removeLayer(usBordersLayer);
  }
}

function fitRegion(viewKey, animate, extraBottom) {
  if (!lmap) return;
  const b = viewKey === 'atlantic' ? ATLANTIC_BOUNDS : (viewKey === 'massbay' ? MASS_BAY_BOUNDS : US_BOUNDS);
  const padB = extraBottom || M.padBottom || 34;
  const padT = extraBottom ? 78 : 125;
  lmap.fitBounds(b, { paddingTopLeft: [24, padT], paddingBottomRight: [24, padB], animate: !!animate, duration: 0.55 });
}
$('btn-reset-view').addEventListener('click', () => { sfxPop(); fitRegion(M.viewKey, true); });

function cancelSail() {
  if (sailRaf) { cancelAnimationFrame(sailRaf); sailRaf = 0; }
  const el = $('ship-el');
  if (el) el.classList.remove('ship-sailing');
}

// Redraws the continuous golden sailed trail smoothly from Plymouth UK up to the current ship point (zero broken gaps!)
function redrawContinuousTrail(curLatLng) {
  if (!mapTrailLayer) return;
  mapTrailLayer.clearLayers();
  const lon = curLatLng[1];
  const pts = [FULL_ROUTE[1]];
  for (let i = 2; i < FULL_ROUTE.length; i++) {
    if (FULL_ROUTE[i][1] >= lon) pts.push(FULL_ROUTE[i]);
  }
  pts.push(curLatLng);
  if (pts.length >= 2) {
    L.polyline(pts, { color: '#F5C242', weight: 4, opacity: 0.92, interactive: false }).addTo(mapTrailLayer);
  }
}

function animateShipTo(targetLatLng, durationMs, onDone) {
  cancelSail();
  if (!shipMarker) { if (onDone) onDone(); return; }
  const start = M.shipLatLng.slice();
  const [lat0, lon0] = start;
  const [lat1, lon1] = targetLatLng;
  if (Math.hypot(lat1 - lat0, lon1 - lon0) < 0.25 || durationMs <= 0) {
    M.shipLatLng = [lat1, lon1];
    shipMarker.setLatLng(M.shipLatLng);
    redrawContinuousTrail(M.shipLatLng);
    if (onDone) onDone();
    return;
  }
  const tk = M.runToken;
  const el = $('ship-el');
  if (el) el.classList.add('ship-sailing');
  sfxSail();

  const pts = [start];
  const minLon = Math.min(lon0, lon1), maxLon = Math.max(lon0, lon1);
  FULL_ROUTE.forEach(p => { if (p[1] < maxLon - 0.5 && p[1] > minLon + 0.5) pts.push(p); });
  if (lon1 < lon0) pts.sort((a, b) => b[1] - a[1]);
  else pts.sort((a, b) => a[1] - b[1]);
  pts.push([lat1, lon1]);

  const segs = [0];
  let totalL = 0;
  for (let i = 1; i < pts.length; i++) {
    totalL += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(totalL);
  }
  const tStart = performance.now();

  function frame(now) {
    if (tk !== M.runToken) { cancelSail(); return; }
    const u = Math.min(1, (now - tStart) / durationMs);
    const eased = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const d = eased * totalL;
    let segIdx = 1;
    while (segIdx < segs.length - 1 && segs[segIdx] < d) segIdx++;
    const s0 = segs[segIdx - 1], s1 = segs[segIdx];
    const f = s1 > s0 ? (d - s0) / (s1 - s0) : 1;
    M.shipLatLng = [pts[segIdx - 1][0] + (pts[segIdx][0] - pts[segIdx - 1][0]) * f, pts[segIdx - 1][1] + (pts[segIdx][1] - pts[segIdx - 1][1]) * f];
    shipMarker.setLatLng(M.shipLatLng);
    redrawContinuousTrail(M.shipLatLng);
    if (u < 1) sailRaf = requestAnimationFrame(frame);
    else { sailRaf = 0; if (el) el.classList.remove('ship-sailing'); if (onDone) onDone(); }
  }
  sailRaf = requestAnimationFrame(frame);
}

function updateVoyageLog(day, miles, status, isGood) {
  const vl = $('voyage-log');
  if (!day) { vl.hidden = true; return; }
  vl.hidden = false;
  vl.innerHTML =
    `<span class="vlog-chip">${ICONS.calMini}${day}</span>` +
    `<span class="vlog-chip sea">${ICONS.compMini}${miles.toLocaleString()} mi</span>` +
    `<span class="vlog-chip ${isGood ? 'ok' : ''}">${ICONS.flagMini}${status}</span>`;
}

function startMapGame() {
  stopVoice(); clearToast(); cancelSail();
  M.runToken++;
  // Rotate Europe start between Plymouth England and Leiden Netherlands so all 21 locations/events are reachable!
  const euroStart = (S.seenMap.plymouth_uk || 0) > (S.seenMap.leiden || 0) ? MAP_LOCATIONS.leiden : MAP_LOCATIONS.plymouth_uk;
  const events = shuffle(SEA_EVENTS).slice(0, 2).sort((a, b) => a.miles - b.miles);
  const colonyEv = pickFresh(COLONY_EVENTS, S.seenMap, 1)[0];
  const usStops = pickFresh(US_LOC_LIST, S.seenMap, 3).map(loc => ({ kind: 'pin', loc }));

  M.steps = [
    { kind: 'pin', loc: euroStart },
    ...events,
    { kind: 'pin', loc: MAP_LOCATIONS.capecod },
    { kind: 'pin', loc: MAP_LOCATIONS.plymouth_ma },
    colonyEv,
    { kind: 'pin', loc: MAP_LOCATIONS.virginia },
    ...usStops
  ];
  M.i = 0; M.ok = 0; M.chips = [];
  // Park Mayflower cleanly offshore southwest of England so the Plymouth UK pin is 100% visible!
  M.shipLatLng = [48.6, -7.8];

  show('s-map');
  initLeafletMap();
  mapTrailLayer.clearLayers();
  shipMarker.setLatLng(M.shipLatLng);
  setTimeout(() => { lmap.invalidateSize(); renderMapStep(); }, 60);
}

function renderMapBar(showNext, nextText, canReadOpts) {
  $('m-bar').innerHTML =
    `<button class="act plain" id="m-hear">${ICONS.voiceOn}Hear it</button>` +
    (canReadOpts && !showNext ? `<button class="act plain" id="m-read-opts">${ICONS.listVoice}Read choices</button>` : '') +
    (showNext ? `<button class="act go" id="m-next">${nextText || (M.i === M.steps.length - 1 ? 'Finish' : 'Continue')}${ICONS.next}</button>` : '');
  $('m-hear').addEventListener('click', () => { sfxPop(); playVoice(M.curClip, M.curText, true); });
  if ($('m-read-opts')) {
    $('m-read-opts').addEventListener('click', () => {
      sfxPop();
      readChoicesSequentially('#se-opts .se-opt-row', r => r.querySelector('.se-opt-btn').textContent);
    });
  }
  if (showNext) {
    $('m-next').addEventListener('click', () => {
      sfxPop(); stopVoice(); clearToast(); cancelSail();
      M.i++;
      if (M.i >= M.steps.length) finishRound('map', M.ok, M.steps.length, M.chips, 'img/mayflower.jpg');
      else renderMapStep();
    });

}

function renderMapStep() {
  const step = M.steps[M.i];
  M.tries = 0; M.busy = false; M.padBottom = 34;
  setTrack('m', M.i, M.steps.length);
  $('map-hud').classList.remove('ok', 'oops', 'compact');
  $('map-tag').hidden = false;
  $('map-q').hidden = false;
  $('map-card').hidden = true;
  $('sea-event').hidden = true;
  $('sea-event').classList.remove('colony-card');

  const onVoyage = step.kind === 'event' || step.kind === 'colony' || step.loc.region === 'atlantic' || step.loc.region === 'massbay';
  if (onVoyage) {
    if (!lmap.hasLayer(mapRouteLayer)) mapRouteLayer.addTo(lmap);
    if (!lmap.hasLayer(mapTrailLayer)) mapTrailLayer.addTo(lmap);
  } else {
    if (lmap.hasLayer(mapRouteLayer)) lmap.removeLayer(mapRouteLayer);
    if (lmap.hasLayer(mapTrailLayer)) lmap.removeLayer(mapTrailLayer);
  }

  // ---- OREGON TRAIL MID-ATLANTIC SAILING EVENT ----
  if (step.kind === 'event') {
    M.viewKey = 'atlantic';
    M.padBottom = 310;
    updateBordersForView();
    fitRegion('atlantic', false, M.padBottom);
    mapPinsLayer.clearLayers();
    M.pinMap = {};

    $('map-tag').className = 'q-tag sea';
    $('map-tag').textContent = '1620 Atlantic Crossing · Ship\'s Log';
    $('map-q').textContent = 'The Mayflower is sailing west across the North Atlantic...';
    updateVoyageLog(step.day, step.miles, 'Sailing west', false);
    renderMapBar(false);

    animateShipTo([step.lat, step.lon], 1300, () => {
      // Collapse top HUD to compact Voyage Log chips so it never duplicates the Sea Event card title!
      $('map-hud').classList.add('compact');
      $('map-tag').hidden = true;
      $('map-q').hidden = true;
      updateVoyageLog(step.day, step.miles, step.status, false);
      openSeaEvent(step, 'Sail On');
    });
    return;
  }

  // ---- FIRST-YEAR PLYMOUTH COLONY SURVIVAL EVENT ----
  if (step.kind === 'colony') {
    M.viewKey = 'massbay';
    M.padBottom = 310;
    updateBordersForView();
    fitRegion('massbay', false, M.padBottom);
    renderPinsForView(MAP_LOCATIONS.plymouth_ma);
    M.shipLatLng = [42.02, -70.48];
    shipMarker.setLatLng(M.shipLatLng);
    redrawContinuousTrail(M.shipLatLng);

    $('map-hud').classList.add('compact');
    $('map-tag').hidden = true;
    $('map-q').hidden = true;
    $('sea-event').classList.add('colony-card');
    updateVoyageLog(step.day, step.miles, step.status, false);
    openSeaEvent(step, 'Continue Journey');
    return;
  }

  // ---- PIN LOCATION STEP ----
  const loc = step.loc;
  M.viewKey = loc.region;
  M.curClip = 'mq_' + loc.id;
  M.curText = loc.q;
  updateBordersForView();

  $('map-tag').className = 'q-tag ' + (loc.region === 'us' ? 'bio' : '');
  $('map-tag').textContent = loc.region === 'massbay'
    ? 'Massachusetts Bay (Close-Up Real Map)'
    : (loc.region === 'atlantic' ? '1620 Mayflower Voyage (Real Map)' : 'US Thanksgiving Geography & Biogeography');
  $('map-q').textContent = loc.q;
  updateVoyageLog(loc.day || '', loc.miles || 0, loc.status || '', loc.id === 'capecod' || loc.id === 'plymouth_ma');

  fitRegion(M.viewKey, false);
  renderPinsForView(loc);

  // Position ship offshore in open water so pins and labels remain 100% unobstructed!
  if (loc.id === 'capecod') {
    M.shipLatLng = [42.20, -69.52];
    shipMarker.setLatLng(M.shipLatLng);
    redrawContinuousTrail(M.shipLatLng);
    animateShipTo([42.18, -69.92], 950);
  } else if (loc.id === 'plymouth_ma') {
    M.shipLatLng = [42.14, -70.10];
    shipMarker.setLatLng(M.shipLatLng);
    redrawContinuousTrail(M.shipLatLng);
    animateShipTo([42.02, -70.48], 850);
  } else if (loc.id === 'virginia') {
    M.shipLatLng = [42.02, -70.48];
    shipMarker.setLatLng(M.shipLatLng);
    redrawContinuousTrail(M.shipLatLng);
  }

  renderMapBar(false);
  playVoice(M.curClip, M.curText, false);
}

function openSeaEvent(ev, nextLbl) {
  M.curClip = ev.qClip; M.curText = ev.q;
  $('se-img').src = ev.img;
  $('se-img').alt = ev.title;
  $('se-badge').textContent = ev.badge;
  $('se-title').textContent = ev.title;
  $('se-desc').textContent = ev.q;
  const outEl = $('se-outcome');
  outEl.hidden = true;
  outEl.classList.remove('warn');

  const opts = shuffle(ev.opts);
  $('se-opts').innerHTML = opts.map(o => `<div class="se-opt-row" data-oid="${o.id}">
    <button class="se-opt-btn">${o.text}</button>
    <button class="se-opt-say" aria-label="Read choice aloud" title="Hear this choice">${ICONS.voiceOn}</button>
  </div>`).join('');
  $('sea-event').hidden = false;
  renderMapBar(false, null, true);
  playVoice(ev.qClip, ev.q, false);

  document.querySelectorAll('#se-opts .se-opt-row').forEach(row => {
    const optObj = ev.opts.find(x => x.id === row.dataset.oid);
    row.querySelector('.se-opt-say').addEventListener('click', e => {
      e.stopPropagation();
      if (row.classList.contains('dim')) return;
      stopVoice(); sfxPop();
      row.classList.add('speaking');
      speakTextPromise(optObj.text).then(() => row.classList.remove('speaking'));
    });

    row.querySelector('.se-opt-btn').addEventListener('click', () => {
      if (M.busy || row.classList.contains('dim')) return;
      if (row.dataset.oid === ev.answer) {
        M.busy = true;
        clearToast(); stopVoice();
        sfxOk();
        S.stats.map.n++;
        if (M.tries === 0) { S.stats.map.ok++; M.ok++; }
        S.seenMap[ev.id] = Date.now();
        save();
        row.classList.add('glow');
        document.querySelectorAll('#se-opts .se-opt-row').forEach(x => { if (x !== row) x.classList.add('dim'); });
        $('map-hud').classList.add('ok');
        updateVoyageLog(ev.day, ev.miles, ev.fixedStatus, true);
        outEl.classList.remove('warn');
        outEl.innerHTML = `<b>What happened:</b> ${ev.outcome}`;
        outEl.hidden = false;
        M.chips.push(ev.title.split(' — ')[0]);
        M.curClip = ev.fClip; M.curText = ev.outcome;
        renderMapBar(true, nextLbl || 'Sail On', false);
        playVoice(ev.fClip, ev.outcome, false);
      } else {
        // Real Oregon Trail consequence inline (never covers option buttons!)
        M.tries++;
        sfxOops();
        row.classList.add('dim', 'shake');
        setTimeout(() => row.classList.remove('shake'), 360);
        outEl.classList.add('warn');
        outEl.innerHTML = `<b>Why that wouldn't work:</b> ${optObj.why} Try another plan.`;
        outEl.hidden = false;
        playVoice(optObj.whyClip, optObj.why, false);
      }
    });
  });
}

function renderPinsForView(activeLoc) {
  mapPinsLayer.clearLayers();
  M.pinMap = {};
  const doneIds = new Set(M.steps.slice(0, M.i).filter(s => s.kind === 'pin').map(s => s.loc.id));

  let pinsToShow = [];
  if (activeLoc.region === 'atlantic') {
    pinsToShow = [MAP_LOCATIONS.leiden, MAP_LOCATIONS.plymouth_uk, MAP_LOCATIONS.virginia];
  } else if (activeLoc.region === 'massbay') {
    pinsToShow = [MAP_LOCATIONS.plymouth_ma, MAP_LOCATIONS.capecod];
  } else {
    pinsToShow = US_LOC_LIST;
  }

  pinsToShow.forEach(p => {
    const isDone = doneIds.has(p.id);
    const lblCls = p.lbl && p.lbl !== 'above' ? p.lbl : '';
    const icon = L.divIcon({
      className: '',
      html: `<div class="tg-pin ${isDone ? 'done' : ''}" data-pid="${p.id}"><span class="tg-lbl ${lblCls}">${p.name}</span></div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17]
    });
    const marker = L.marker([p.lat, p.lon], { icon }).addTo(mapPinsLayer);
    M.pinMap[p.id] = marker;
    marker.on('click', () => onPinTap(p, marker));
  });
}

function onPinTap(p, marker) {
  if (M.busy) return;
  const step = M.steps[M.i];
  if (!step || step.kind !== 'pin') return;
  const item = step.loc;
  const el = marker.getElement()?.querySelector('.tg-pin');
  if (!el || el.classList.contains('dim') || el.classList.contains('done')) return;

  if (p.id === item.id) {
    M.busy = true;
    clearToast(); stopVoice();
    sfxOk();
    S.stats.map.n++;
    if (M.tries === 0) { S.stats.map.ok++; M.ok++; }
    S.seenMap[item.id] = Date.now();
    save();
    el.classList.remove('hint');
    el.classList.add('done');
    $('map-hud').classList.remove('oops');
    $('map-hud').classList.add('ok');

    const latOffset = item.region === 'massbay' ? 0.28 : 2.0;
    lmap.panTo([item.lat - latOffset, item.lon], { animate: true, duration: 0.45 });

    $('mc-img').src = item.img;
    $('mc-img').alt = item.name;
    $('mc-title').textContent = item.name;
    $('mc-fact').textContent = item.fact;
    $('map-card').hidden = false;

    M.chips.push(item.name);
    M.curClip = item.factClip; M.curText = item.fact;
    const nextLbl = (item.id === 'plymouth_uk' || item.id === 'leiden') ? 'Set Sail' : (M.i === M.steps.length - 1 ? 'Finish' : 'Next Stop');
    renderMapBar(true, nextLbl, false);
    playVoice(M.curClip, M.curText, false);
  } else {
    M.tries++;
    sfxOops();
    el.classList.add('dim');
    $('map-hud').classList.add('oops');
    toast(item.nudge, 3200);
    if (S.settings.autoRead) speakTextPromise(item.nudge);
    if (M.tries >= 1) {
      const rightEl = M.pinMap[item.id]?.getElement()?.querySelector('.tg-pin');
      if (rightEl) rightEl.classList.add('hint');
    }
  }
}

      <label>Voice narration</label>
      <button class="pbtn ${S.settings.autoRead ? 'on' : ''}" id="set-autoread">${S.settings.autoRead ? 'Auto-read On' : 'Tap Hear it Only'}</button>
      <button class="pbtn" id="set-test">Test voice</button>
    </div>
    <div class="field">
      <label>Map pin labels</label>
      <button class="pbtn ${S.settings.mapLabels !== false ? 'on' : ''}" id="set-labels">${S.settings.mapLabels !== false ? 'Labels Shown' : 'Hidden Until Found'}</button>
    </div>
    <div class="field">
      <label>Sound effects</label>
      <button class="pbtn ${S.settings.sfx ? 'on' : ''}" id="set-sfx">${S.settings.sfx ? 'Chimes On' : 'Muted'}</button>
    </div>
    <div class="field">
      <label>Theme</label>
      ${['auto', 'light', 'dark'].map(t => `<button class="pbtn ${S.settings.theme === t ? 'on' : ''}" data-th="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}
    </div>
    <h3>On the iPad</h3>
    <p>For full screen without Safari toolbars, tap Share, then Add to Home Screen, and open Learning Games from that icon.</p>
    <h3>Data</h3>
    <div class="field"><button class="pbtn warn" id="set-reset">Hold to erase progress</button></div>
  `;
  $('set-autoread').addEventListener('click', () => { S.settings.autoRead = !S.settings.autoRead; save(); updateVoiceButtons(); renderSettings(); });
  $('set-labels').addEventListener('click', () => { S.settings.mapLabels = !(S.settings.mapLabels !== false); save(); applyMapLabelsUI(); renderSettings(); });
  $('set-test').addEventListener('click', () => playVoice('ev_beam_q', SEA_EVENTS[0].q, true));
  $('set-sfx').addEventListener('click', () => { S.settings.sfx = !S.settings.sfx; save(); renderSettings(); });
  document.querySelectorAll('[data-th]').forEach(b => b.addEventListener('click', () => { S.settings.theme = b.dataset.th; applyTheme(); save(); renderSettings(); }));
  pointerHold($('set-reset'), 3000, () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = JSON.parse(JSON.stringify(DEFAULT)); save(); applyTheme(); applyMapLabelsUI(); toast('Progress erased.'); openParent();
  }, null, () => toast('Hold for three seconds to erase.'));
}

renderHome();
show('s-home');
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});</script>
</body>
</html>
