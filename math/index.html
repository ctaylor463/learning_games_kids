:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --ground:#F7F8FA; --grid:#DFE6EE; --card:#FFFFFF; --ink:#1F2A37; --ink-soft:#69778A; --line:#D3DBE4;
  --accent:#E8730C; --good:#3E9B5F; --amber:#E0A13A; --shadow:0 6px 24px rgba(31,42,55,.10);
  --c1:#F2F2F2; --c2:#D6413E; --c3:#7FB069; --c4:#8E6BB5; --c5:#F0C419;
  --c6:#2E7D4F; --c7:#3B3B3B; --c8:#8D6E4F; --c9:#3D6FB5; --c10:#E8730C;
  --f-num:'Fredoka','Trebuchet MS',sans-serif;
  --f-read:'ABeeZee','Trebuchet MS','Verdana',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141A21; --grid:#243040; --card:#1E262F; --ink:#EDF1F5; --ink-soft:#9FADBD; --line:#36434F;
    --accent:#F2903A; --good:#5DBA7A; --amber:#E8B04C; --shadow:0 6px 24px rgba(0,0,0,.35);
    --c1:#4A5461; --c7:#9AA4AE;
  }
}
:root[data-theme="dark"]{
  --ground:#141A21; --grid:#243040; --card:#1E262F; --ink:#EDF1F5; --ink-soft:#9FADBD; --line:#36434F;
  --accent:#F2903A; --good:#5DBA7A; --amber:#E8B04C; --shadow:0 6px 24px rgba(0,0,0,.35);
  --c1:#4A5461; --c7:#9AA4AE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-read);font-size:18px;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;
  background:var(--ground);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

.strip{display:flex;align-items:center;gap:12px;padding:max(10px,var(--sat)) max(14px,var(--sar)) 10px max(14px,var(--sal));min-height:64px}
.iconbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:30px;height:30px}
.iconbtn.small{width:44px;height:44px}
.iconbtn.small svg{width:22px;height:22px}
.track{flex:1;max-width:420px;height:40px;position:relative;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden;display:flex;align-items:center;padding:5px}
.track .ticks{position:relative;display:flex;width:100%;height:100%;gap:4px}
.track .ticks span{flex:1;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line);position:relative}
.track .ticks span.done::after{content:'';position:absolute;inset:16%;border-radius:50%;background:var(--c2)}
@media (prefers-reduced-motion: reduce){.track .ticks span.done::after{transition:none}}
.rv{animation:rvIn .45s ease-out both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
@keyframes rvIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.rvdraw{stroke-dasharray:1;stroke-dashoffset:1;animation:rvDraw .8s ease-in-out forwards;animation-delay:var(--d,0s)}
@keyframes rvDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.rv,.rvdraw{animation:none;stroke-dashoffset:0}}

.home{flex:1;display:flex;flex-direction:column;padding:max(6px,var(--sat)) max(18px,var(--sar)) max(18px,var(--sab)) max(18px,var(--sal));gap:14px;min-height:0}
.hometop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%}
.brand{font-family:var(--f-num);font-weight:600;font-size:30px}
.brand small{display:block;font-family:var(--f-read);font-weight:400;font-size:15px;color:var(--ink-soft);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;flex:1;min-height:0}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;border:4px solid transparent;min-height:130px}
.tile:active{transform:scale(.98)}
.tile .glyph{height:110px;display:flex;align-items:center;justify-content:center}
.tile .glyph svg{height:110px;width:auto;max-width:100%;display:block}
.tile .label{font-family:var(--f-num);font-size:30px;font-weight:600;color:var(--ink);text-align:center}
.tile .sub{font-size:17px;color:var(--ink-soft);text-align:center}
.tile.locked{opacity:.45}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:100%;max-width:720px}
.key{height:78px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-family:var(--f-num);font-weight:600;font-size:38px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.key:active{transform:scale(.96)}
.key svg{width:34px;height:34px}
.key.del{color:var(--ink-soft)}
.key.ok{background:var(--accent);color:#fff}
.eq .box.wrong{border-color:var(--amber);color:var(--amber)}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gate{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;overflow:hidden}
.gate svg{width:26px;height:26px;position:relative}
.gate .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--c5)}
.done-note{font-size:15px;color:var(--ink-soft)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px 14px;min-height:0;gap:16px}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);width:100%;max-width:820px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;position:relative;border:6px solid transparent;transition:border-color .3s}
.card>div:not(.prompt):not(.eq){width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.card.ok{border-color:var(--good)}
.card.oops{border-color:var(--amber)}
.prompt{font-family:var(--f-num);font-weight:500;font-size:min(6vw,30px);color:var(--ink-soft);text-align:center}
.eq{font-family:var(--f-num);font-weight:600;font-size:min(15vw,86px);display:flex;align-items:center;gap:.18em;line-height:1;font-variant-numeric:tabular-nums}
.eq .box{min-width:1.1em;height:1.15em;border-radius:.14em;border:.06em dashed var(--line);display:inline-flex;align-items:center;justify-content:center;padding:0 .06em}
.eq .box.filled{border-style:solid;border-color:var(--accent);color:var(--accent)}
.eq .op{color:var(--ink-soft)}

svg.tf{width:100%;max-width:min(92vw,560px);height:auto;display:block}
svg.die{width:min(30vw,130px);height:auto;display:block}
svg.dots{width:100%;max-width:min(80vw,420px);height:auto;display:block}
svg.rek{width:100%;max-width:min(92vw,600px);height:auto;display:block}
svg.nline{width:100%;max-width:min(94vw,760px);height:auto;display:block}
svg.rod{height:34px;width:auto;display:block}
svg.bt{height:min(22vw,124px);width:auto;display:block}
svg.oline{width:100%;max-width:min(94vw,720px);height:auto;display:block}
.btrow{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.btrow .op{font-family:var(--f-num);font-weight:600;font-size:34px;color:var(--ink-soft);align-self:center}
svg.bond{width:min(70vw,320px);height:auto;display:block}
.pairwrap{display:flex;gap:18px;align-items:center;justify-content:center}
.twoside{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.twoside svg.tf{max-width:min(44vw,300px)}
.hidden-art{font-family:var(--f-num);font-weight:600;font-size:min(20vw,110px);color:var(--line);line-height:1}
.pnote{min-height:26px;font-family:var(--f-num);font-size:19px;color:var(--good);opacity:0;transition:opacity .3s;text-align:center}
.rodrow{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.rodrow .lbl{font-family:var(--f-num);font-size:15px;color:var(--ink-soft)}
.choices{display:flex;gap:14px;width:100%;max-width:820px;justify-content:center;flex-wrap:wrap}
.choice{flex:0 1 auto;min-width:92px;min-height:92px;padding:0 18px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:min(9vw,48px);border:5px solid transparent;transition:border-color .2s,opacity .2s,transform .1s;font-variant-numeric:tabular-nums}
.choice:active{transform:scale(.97)}
.choice.glow{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.choice.dim{opacity:.32}
.choice.wide{min-width:150px}

.bar{display:flex;justify-content:center;gap:20px;padding:10px 18px max(20px,var(--sab));align-items:center;flex-wrap:wrap}
.act{height:78px;min-width:140px;padding:0 28px;border-radius:39px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-num);font-weight:600;font-size:21px;box-shadow:var(--shadow)}
.act svg{width:34px;height:34px}
.act.plain{background:var(--card);color:var(--ink)}
.act.go{background:var(--accent);color:#fff;min-width:190px}
.act[disabled]{opacity:.35;pointer-events:none}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.center h1{font-family:var(--f-num);font-weight:600;font-size:34px;margin:0}
.center p{margin:0;color:var(--ink-soft);max-width:34em}
.bigart{width:min(52vw,280px)}
.bigart svg{width:100%;height:auto;display:block}

.parent{flex:1;display:flex;flex-direction:column;min-height:0;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.tab{font-family:var(--f-num);font-weight:600;font-size:16px;padding:10px 16px;border-radius:999px;background:var(--card);color:var(--ink-soft);white-space:nowrap}
.tab.on{background:var(--ink);color:var(--ground)}
.pane{display:none;flex:1;overflow:auto;padding:0 18px 28px;min-height:0}
.pane.on{display:block}
.pane h2{font-family:var(--f-num);font-weight:600;font-size:22px;margin:18px 0 8px}
.pane h3{font-family:var(--f-num);font-weight:600;font-size:15px;margin:16px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.pane p,.pane li{font-size:16px;line-height:1.5;max-width:66ch}
.pane table{border-collapse:collapse;width:100%;max-width:760px;font-size:15px;font-variant-numeric:tabular-nums}
.pane th,.pane td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.pane th{font-family:var(--f-num);font-weight:600;color:var(--ink-soft);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.pbtn{font-family:var(--f-num);font-weight:600;font-size:16px;padding:12px 18px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin:4px 6px 4px 0;min-height:48px}
.field select{font-family:var(--f-num);font-weight:600;font-size:16px;padding:12px 14px;border-radius:14px;background:var(--card);color:var(--ink);border:2px solid var(--line);min-height:48px;max-width:100%}
.pbtn.warn{background:var(--amber);color:#1F2A37}
.pbtn.on{outline:3px solid var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tipcard{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.tipcard b{font-family:var(--f-num);display:block;margin-bottom:4px}
.field{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.note{font-size:15px;color:var(--ink-soft)}
.factgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px;max-width:760px}
.factgrid div{aspect-ratio:1.5;border-radius:7px;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;background:var(--line);color:var(--ink-soft)}
.factgrid div.k0{background:#E9EDF2;color:#8C99A8}
.factgrid div.k1{background:#F6D6C8;color:#7A3A1C}
.factgrid div.k2{background:#F7E6A8;color:#6B5410}
.factgrid div.k3{background:#BFE3C9;color:#1F5B34}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:50}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

<section class="screen on" id="s-home">
  <div class="home">
    <div class="hometop">
      <div class="brand">Math Game<small id="home-sub">Numbers you can see</small></div>
      <div style="display:flex;gap:12px">
        <a class="iconbtn" href="../" aria-label="All games" title="All games" style="color:inherit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></a>
        <button class="iconbtn" id="btn-fs" data-fs-btn aria-label="Toggle full screen"><span data-icon="fullscreen"></span></button>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="homefoot">
      <span class="done-note" id="home-note"></span>
      <button class="gate" id="gate" aria-label="Grown-ups: hold for three seconds"><span class="fill"></span><span data-icon="lock"></span></button>
    </div>
  </div>
</section>

<section class="screen" id="s-play">
  <div class="strip">
    <button class="iconbtn" id="btn-home" aria-label="Home"><span data-icon="home"></span></button>
    <div class="track" id="track"><div class="ticks" id="track-ticks"></div></div>
    <button class="iconbtn" id="btn-play-fs" data-fs-btn aria-label="Toggle full screen"><span data-icon="fullscreen"></span></button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar" id="bar"></div>
</section>

<section class="screen" id="s-end">
  <div class="center">
    <div class="bigart" id="end-art"></div>
    <h1 id="end-title">Round finished.</h1>
    <p id="end-text"></p>
    <div class="bar" style="padding-bottom:0">
      <button class="act plain" id="btn-end-home" aria-label="Home"><span data-icon="home"></span></button>
      <button class="act go" id="btn-end-more" aria-label="Another round"><span data-icon="next"></span></button>
    </div>
  </div>
</section>

<section class="screen" id="s-alldone">
  <div class="center">
    <div class="bigart" id="alldone-art"></div>
    <h1>All done for today.</h1>
    <p>Math time is finished. Count something real together.</p>
    <button class="act plain" id="btn-alldone-home" aria-label="Home"><span data-icon="home"></span></button>
  </div>
</section>

<section class="screen" id="s-parent">
  <div class="parent">
    <div class="strip">
      <button class="iconbtn small" id="btn-parent-close" aria-label="Close"><span data-icon="close"></span></button>
      <div class="brand" style="font-size:22px;flex:1">Grown-ups</div>
    </div>
    <div class="tabs">
      <button class="tab on" data-pane="how">How to play</button>
      <button class="tab" data-pane="progress">Progress</button>
      <button class="tab" data-pane="facts">Fact map</button>
      <button class="tab" data-pane="settings">Settings</button>
    </div>
    <div class="pane on" id="pane-how"></div>
    <div class="pane" id="pane-progress"></div>
    <div class="pane" id="pane-facts"></div>
    <div class="pane" id="pane-settings"></div>
  </div>
</section>

<div class="toast" id="toast"></div>
</div>
<script>
// ---------- Icons ----------
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5h4v5"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h11a5 5 0 0 1 0 10H8"/><path d="m8 4-4 4 4 4"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  fullscreen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>',
  fullscreenExit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M10 10H4m6 0V4m0 6L3 3m11 7h6m-6 0V4m0 6l7-7"/></svg>'
};
const RODC = ['','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)','var(--c9)','var(--c10)'];

// ---------- Ten frame ----------
// n counters, or [a,b] for a two-colour part-whole fill. cap 10 per frame; >10 draws two frames.
function tenFrame(spec, o){
  o = o || {}; const cw = 46, gap = 5, pad = 6;
  const parts = Array.isArray(spec) ? spec.concat([0, 0]).slice(0, 3) : [spec, 0, 0];
  const total = parts[0] + parts[1] + parts[2];
  const frames = Math.max(1, Math.ceil(Math.max(total, o.min || 0) / 10));
  const fw = 5 * cw + 4 * gap + 2 * pad, fh = 2 * cw + gap + 2 * pad;
  const W = frames * fw + (frames - 1) * 16, H = fh;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="tf" role="img" aria-label="${total} counters">`;
  let k = 0;
  for (let f = 0; f < frames; f++) {
    const ox = f * (fw + 16);
    s += `<rect x="${ox + 1}" y="1" width="${fw - 2}" height="${fh - 2}" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>`;
    for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) {
      const x = ox + pad + c * (cw + gap), y = pad + r * (cw + gap);
      s += `<rect x="${x}" y="${y}" width="${cw}" height="${cw}" rx="7" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;
      k++;
      if (k <= total) {
        const seg = k <= parts[0] ? 0 : k <= parts[0] + parts[1] ? 1 : 2;
        const col = [o.c1 || 'var(--c2)', o.c2 || 'var(--c9)', o.c3 || 'var(--accent)'][seg];
        const hide = o.hide && k > o.hide;
        // o.anim = [start of part two, start of part three] in seconds: counters then appear one by one.
        const j = seg === 1 ? k - parts[0] - 1 : k - parts[0] - parts[1] - 1;
        const an = o.anim && seg > 0 ? ` class="rv" style="--d:${(o.anim[seg - 1] + j * 0.12).toFixed(2)}s"` : '';
        s += `<circle${an} cx="${x + cw / 2}" cy="${y + cw / 2}" r="${cw * 0.36}" fill="${hide ? 'none' : col}" ${hide ? 'stroke="var(--line)" stroke-width="2" stroke-dasharray="4 3"' : ''}/>`;
        // o.cross: the last n counters are taken away, drawn with a cross over them.
        if (o.cross && k > total - o.cross) { const cx = x + cw / 2, cy = y + cw / 2, d = cw * 0.3, j2 = k - (total - o.cross) - 1;
          const ac = o.crossD === undefined ? '' : ` class="rv" style="--d:${(o.crossD + j2 * 0.15).toFixed(2)}s"`;
          s += `<g${ac}><circle cx="${cx}" cy="${cy}" r="${cw * 0.36}" fill="var(--card)" opacity=".6"/><path d="M ${cx-d} ${cy-d} L ${cx+d} ${cy+d} M ${cx+d} ${cy-d} L ${cx-d} ${cy+d}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></g>`; }
      }
    }
  }
  return s + '</svg>';
}

// ---------- Subitizing dot patterns ----------
const PIPS = {1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]};
function dieFace(n, size){
  size = size || 120; const u = size / 3;
  let s = `<svg viewBox="0 0 ${size} ${size}" class="die" role="img" aria-label="${n}"><rect x="2" y="2" width="${size-4}" height="${size-4}" rx="${size*0.16}" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>`;
  (PIPS[n]||[]).forEach(([c,r])=>{ s += `<circle cx="${u*c + u/2 + (c-1)*2}" cy="${u*r + u/2 + (r-1)*2}" r="${u*0.20}" fill="var(--ink)"/>`; });
  return s + '</svg>';
}
// Scattered or grouped dots for conceptual subitizing (7 to 10 shown as 5 plus n)
function dotSet(n, style){
  const R = 17, gap = 9;
  if (style === 'die' && n <= 6) return dieFace(n, 130);
  if (style === 'pair') { // two dice faces side by side, for 7 to 12
    const a = Math.min(6, Math.ceil(n / 2)), b = n - a;
    return `<span class="pairwrap">${dieFace(a, 108)}${dieFace(b, 108)}</span>`;
  }
  const cols = Math.min(5, n), rows = Math.ceil(n / 5);
  const W = cols * (2*R) + (cols-1)*gap + 8, H = rows * (2*R) + (rows-1)*gap + 8;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="dots" role="img" aria-label="${n}">`;
  for (let i = 0; i < n; i++) { const r = Math.floor(i/5), c = i%5;
    s += `<circle cx="${4 + R + c*(2*R+gap)}" cy="${4 + R + r*(2*R+gap)}" r="${R}" fill="${r===0?'var(--c2)':'var(--c9)'}"/>`; }
  return s + '</svg>';
}

// ---------- Rekenrek ----------
function rekenrek(a, b){
  const bw = 34, gap = 3, pad = 10, rowH = 46;
  const W = 10 * bw + 9 * gap + 2 * pad + 40, H = 2 * rowH + pad * 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="rek" role="img" aria-label="${a+b} beads">`;
  s += `<rect x="2" y="2" width="${W-4}" height="${H-4}" rx="12" fill="none" stroke="var(--line)" stroke-width="2.5"/>`;
  [a, b].forEach((cnt, r) => {
    const y = pad + r * rowH + rowH / 2;
    s += `<line x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}" stroke="var(--line)" stroke-width="2"/>`;
    for (let i = 0; i < 10; i++) {
      const pushed = i < cnt;
      const x = pushed ? pad + i * (bw + gap) + bw / 2 : W - pad - (10 - i) * (bw + gap) + bw / 2 + 6;
      s += `<circle cx="${x}" cy="${y}" r="${bw/2 - 1}" fill="${i < 5 ? 'var(--c2)' : 'var(--c1)'}" stroke="var(--ink-soft)" stroke-width="1.5"/>`;
    }
  });
  return s + '</svg>';
}

// ---------- Number line ----------
function numberLine(min, max, o){
  o = o || {}; const n = max - min, step = 62, pad = 34;
  const W = n * step + pad * 2, H = o.hops && o.hops.length ? 132 : 86, base = H - 34;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="nline" role="img" aria-label="number line ${min} to ${max}">`;
  s += `<line x1="${pad}" y1="${base}" x2="${W-pad}" y2="${base}" stroke="var(--ink-soft)" stroke-width="3" stroke-linecap="round"/>`;
  for (let v = min; v <= max; v++) {
    const x = pad + (v - min) * step, major = o.labelAll || v % (o.every || 1) === 0;
    s += `<line x1="${x}" y1="${base - 9}" x2="${x}" y2="${base + 9}" stroke="var(--ink-soft)" stroke-width="${major?3:2}"/>`;
    if (major && !o.blank) s += `<text x="${x}" y="${base + 30}" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="21" fill="var(--ink-soft)">${v}</text>`;
  }
  (o.hops || []).forEach(h => {
    const x1 = pad + (h.from - min) * step, x2 = pad + (h.to - min) * step, mid = (x1 + x2) / 2, r = Math.abs(x2 - x1) / 2;
    const dp = h.d === undefined ? '' : ` pathLength="1" class="rvdraw" style="--d:${h.d}s"`, dt = h.d === undefined ? '' : ` class="rv" style="--d:${h.d + .6}s"`;
    s += `<path${dp} d="M ${x1} ${base-12} A ${r} ${Math.min(r,46)} 0 0 ${x2 > x1 ? 1 : 0} ${x2} ${base-12}" fill="none" stroke="${h.color||'var(--accent)'}" stroke-width="4" stroke-linecap="round"/>`;
    s += `<text${dt} x="${mid}" y="${base - Math.min(r,46) - 18}" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="20" font-weight="600" fill="${h.color||'var(--accent)'}">${h.label||''}</text>`;
  });
  if (o.mark !== undefined && o.mark !== null) {
    const x = pad + (o.mark - min) * step, dm = o.markD === undefined ? '' : ` class="rv" style="--d:${o.markD}s"`;
    s += `<circle${dm} cx="${x}" cy="${base}" r="12" fill="var(--accent)" stroke="var(--card)" stroke-width="3"/>`;
  }
  return s + '</svg>';
}

// ---------- Number bond ----------
function numberBond(whole, a, b, o){
  o = o || {}; const W = 320, H = 210, r = 44;
  const wx = W/2, wy = r + 6, ax = r + 14, ay = H - r - 6, bx = W - r - 14, by = ay;
  const cell = (x, y, v, cls) => v === null
    ? `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="7 6"/>`
    : `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--card)" stroke="var(--line)" stroke-width="3"/><text x="${x}" y="${y+13}" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="40" font-weight="600" fill="var(--ink)">${v}</text>`;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="bond" role="img" aria-label="number bond">`;
  s += `<line x1="${wx-14}" y1="${wy+r-6}" x2="${ax+22}" y2="${ay-r+6}" stroke="var(--line)" stroke-width="3"/>`;
  s += `<line x1="${wx+14}" y1="${wy+r-6}" x2="${bx-22}" y2="${by-r+6}" stroke="var(--line)" stroke-width="3"/>`;
  s += cell(wx, wy, whole) + cell(ax, ay, a) + cell(bx, by, b);
  return s + '</svg>';
}

// ---------- Base ten blocks ----------
// Tens as ten-stacks, ones as loose cubes, so a two digit number is a quantity not two digits.
function baseTen(n, o){
  o = o || {}; const u = o.u || 13, gap = 6, colGap = 16;
  const tens = Math.floor(n / 10), ones = n % 10;
  const cols = tens + (ones ? 1 : 0) || 1;
  const W = tens * (u + gap) + (ones ? colGap + u : 0) + 6, H = 10 * u + 6;
  let s = `<svg viewBox="0 0 ${Math.max(W, u + 6)} ${H}" class="bt" role="img" aria-label="${n}">`;
  const col = o.color || 'var(--c9)', oneCol = o.oneColor || o.color || 'var(--c5)';
  for (let t = 0; t < tens; t++) {
    const x = 3 + t * (u + gap);
    s += `<rect x="${x}" y="3" width="${u}" height="${10*u}" rx="2.5" fill="${col}" stroke="var(--ink-soft)" stroke-width="1.2"/>`;
    for (let k = 1; k < 10; k++) s += `<line x1="${x}" y1="${3+k*u}" x2="${x+u}" y2="${3+k*u}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>`;
  }
  for (let k = 0; k < ones; k++) {
    const x = 3 + tens * (u + gap) + colGap;
    s += `<rect x="${x}" y="${3 + (10-1-k) * u}" width="${u}" height="${u}" rx="2.5" fill="${oneCol}" stroke="var(--ink-soft)" stroke-width="1.2"/>`;
  }
  return s + '</svg>';
}

// ---------- Open number line ----------
// No ticks. Only the landmarks the jumps actually land on, which is the point of it.
function openLine(start, jumps, step){
  const W = 720, H = 128, base = 92, pad = 40;
  const total = jumps.reduce((a,j)=>a+Math.abs(j.d),0) || 1;
  let x = pad, val = start;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="oline" role="img" aria-label="open number line from ${start}">`;
  s += `<line x1="${pad-16}" y1="${base}" x2="${W-pad+16}" y2="${base}" stroke="var(--ink-soft)" stroke-width="3" stroke-linecap="round"/>`;
  // With a step (seconds), each jump draws in turn and its landing number appears after it.
  const rv=d=>step==null?'':` class="rv" style="--d:${d}s"`;
  const mark=(px,v,strong,d)=>`<g${d==null?'':rv(d)}><line x1="${px}" y1="${base-9}" x2="${px}" y2="${base+9}" stroke="var(--ink-soft)" stroke-width="3"/><text x="${px}" y="${base+30}" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="20" font-weight="${strong?600:500}" fill="${strong?'var(--accent)':'var(--ink-soft)'}">${v}</text></g>`;
  s += mark(x, val, false, null);
  jumps.forEach((j,i)=>{
    const w = (Math.abs(j.d) / total) * (W - pad * 2);
    const x2 = x + w, mid = (x + x2) / 2, r = w / 2, t = i * (step || 0);
    const dp = step==null ? '' : ` pathLength="1" class="rvdraw" style="--d:${t}s"`;
    s += `<path${dp} d="M ${x} ${base-11} A ${r} ${Math.min(r,42)} 0 0 1 ${x2} ${base-11}" fill="none" stroke="${j.color||'var(--accent)'}" stroke-width="4" stroke-linecap="round"/>`;
    s += `<text${rv(t+.6)} x="${mid}" y="${base - Math.min(r,42) - 16}" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="19" font-weight="600" fill="${j.color||'var(--accent)'}">${j.d>0?'+':'−'}${Math.abs(j.d)}</text>`;
    val += j.d; x = x2;
    s += mark(x, val, i===jumps.length-1, t+.7);
  });
  return s + '</svg>';
}

// ---------- Decorative ----------
function rodStack(){
  let s = '<svg viewBox="0 0 210 150">';
  [10,7,4,9,5].forEach((n,i)=>{ s += `<rect x="6" y="${6+i*28}" width="${n*19}" height="22" rx="5" fill="${RODC[n]}" stroke="var(--ink-soft)" stroke-width="1.2"/>`; });
  return s + '</svg>';
}
function trophyArt(){
  return '<svg viewBox="0 0 200 160"><rect x="60" y="18" width="80" height="60" rx="10" fill="var(--c5)" stroke="var(--ink-soft)" stroke-width="2"/><path d="M60 30H42a16 16 0 0 0 18 22M140 30h18a16 16 0 0 1-18 22" fill="none" stroke="var(--ink-soft)" stroke-width="4"/><rect x="88" y="78" width="24" height="30" fill="var(--c8)"/><rect x="62" y="108" width="76" height="16" rx="5" fill="var(--c8)"/><rect x="52" y="124" width="96" height="18" rx="6" fill="var(--c10)"/></svg>';

<script>
// ---------- State ----------
const KEY='math-game-v1';
const DEFAULT={v:1, level:0, settings:{limit:false,dark:'auto'}, facts:{}, fam:{}, errors:[], sessions:[], tipIdx:0, todayKey:'', today:{rounds:0,ms:0,done:false}};
let S=load();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); return Object.assign({},DEFAULT,o,{settings:Object.assign({},DEFAULT.settings,o.settings||{})}); } }catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rollDay(){ const k=todayKey(); if(S.todayKey!==k){ S.todayKey=k; S.today={rounds:0,ms:0,done:false}; save(); } }
function currentSession(){ rollDay(); let s=S.sessions[S.sessions.length-1]; if(!s||s.date!==S.todayKey){ s={date:S.todayKey,items:0,first:0,retry:0,minutes:0,level:S.level||0,modes:{}}; S.sessions.push(s); } return s; }

// ---------- Full Screen ----------
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFsButtons(){
  const active = isFullscreen();
  const iconKey = active ? 'fullscreenExit' : 'fullscreen';
  document.querySelectorAll('[data-fs-btn]').forEach(btn => {
    const s = btn.querySelector('[data-icon]');
    if(s){ s.dataset.icon = iconKey; s.innerHTML = ICONS[iconKey] || ''; }
    btn.setAttribute('aria-label', active ? 'Exit full screen' : 'Toggle full screen');
  });
}
async function toggleFullscreen(){
  if(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches){
    toast('Already running full screen from Home Screen.');
    return;
  }
  try{
    if(isFullscreen()){
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) await document.webkitExitFullscreen();
    } else {
      const el = document.documentElement;
      if(el.requestFullscreen) await el.requestFullscreen();
      else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      else {
        toast('To view full screen on iOS: tap Share, then Add to Home Screen.');
      }

  } catch(e){
    toast('To view full screen on iOS: tap Share, then Add to Home Screen.');
  }

}
if(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches){
  document.body.classList.add('standalone');
}
document.addEventListener('fullscreenchange', updateFsButtons);
document.addEventListener('webkitfullscreenchange', updateFsButtons);
document.querySelectorAll('[data-fs-btn]').forEach(btn => {
  btn.addEventListener('click', toggleFullscreen);
});

// ---------- Utilities ----------
const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
document.querySelectorAll('[data-icon]').forEach(el=>{ el.innerHTML=ICONS[el.dataset.icon]||''; });
const icon=n=>ICONS[n]||'';

// ---------- Fact tracking and error classification ----------
// A fact key is the thing being practised, for example "8+5" or "bond10:7" or "count:6".
function F(key){ return S.facts[key]=S.facts[key]||{seen:0,first:0,retry:0}; }
function noteFact(key,firstTry){ const f=F(key); f.seen++; if(firstTry){ f.first++; f.due=false; } else { f.retry++; f.due=true; } f.last=S.todayKey; }
// Fact families, so the parent view can report by strategy rather than by single fact.
const FAM_LABEL={sub10:'Taking away within ten',sub20:'Taking away across ten',bonds10:'Pairs that make ten',doubles:'Doubles',plus012:'Plus nought, one or two',teen:'Ten and some more',bridging:'Bridging past ten',neardoubles:'Near doubles',within10:'Within ten',counting:'Counting and quantity',tens:'Whole tens, plus and minus',twodigit:'Two digit, no carry',carry:'Two digit with a carry',other:'Other'};
function familyOf(it){
  if(it.fam) return it.fam;
  const a=it.a,b=it.b;
  if(a===undefined||b===undefined) return it.kind==='howmany'||it.kind==='showme'?'counting':'other';
  if(a+b===10) return 'bonds10';
  if(a===b) return 'doubles';
  if(a<=2||b<=2) return 'plus012';
  if(a===10||b===10) return 'teen';
  if(a+b>10) return 'bridging';
  if(Math.abs(a-b)===1) return 'neardoubles';
  return 'within10';
}
function FAM(k){ return S.fam[k]=S.fam[k]||{n:0,first:0,ms:[],scaf:0}; }
function noteFam(it,firstTry,ms){ const f=FAM(familyOf(it)); f.n++; if(firstTry) f.first++; if(ms>0&&ms<60000){ f.ms.push(Math.round(ms)); if(f.ms.length>24) f.ms.shift(); } }
function noteScaffold(it){ FAM(familyOf(it)).scaf++; }
function medianMs(arr){ if(!arr||!arr.length) return null; const a=arr.slice().sort((x,y)=>x-y); const m=Math.floor(a.length/2); return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2); }
// Classify a wrong answer so the parent view can show patterns rather than a score.
function classify(mode,item,given){
  const c=item.answer, a=given;
  if(a===undefined||a===null) return 'other';
  if(item.a!==undefined&&item.b!==undefined){
    const crosses=(item.a<10&&item.b<10&&item.a+item.b>10);
    if(a===item.a||a===item.b) return 'gave-a-part';
    if(Math.abs(a-c)===1) return crosses?'off-by-one-crossing':'off-by-one';
    if(crosses&&a===10) return 'stopped-at-ten';
    if(crosses&&Math.abs(a-c)>=2) return 'crossing-ten';
    if(a===Math.abs(item.a-item.b)) return 'subtracted-instead';
    if(a===c+10||a===c-10) return 'ten-off';
  } else {
    if(Math.abs(a-c)===1) return 'off-by-one';
    if(a===c+10||a===c-10) return 'ten-off';
  }
  const rev=String(c).split('').reverse().join('');
  if(String(a)===rev&&String(c).length>1) return 'digits-reversed';
  return 'other';
}
const ERR_LABEL={'off-by-one':'Off by one, a counting slip','off-by-one-crossing':'Off by one while crossing ten','gave-a-part':'Answered with one of the two parts','stopped-at-ten':'Stopped at ten instead of going past','crossing-ten':'Lost the count crossing ten','subtracted-instead':'Subtracted instead of added','ten-off':'Ten out, a place value slip','digits-reversed':'Digits reversed','other':'Something else'};
function noteError(mode,item,given){
  const kind=classify(mode,item,given);
  S.errors.push({d:S.todayKey,m:mode,q:item.label||'',g:given,c:item.answer,k:kind});
  if(S.errors.length>400) S.errors=S.errors.slice(-400);
  return kind;
}

// ---------- The path ----------
// Play walks through these steps in order, one kind of question at a time. L is the difficulty
// handed to the item generators. A step is passed at 13 first-try answers in the last 15.
const PATH=[
  {name:'Seeing to 5', act:'howmany', L:0},
  {name:'Seeing to 10', act:'howmany', L:1},
  {name:'Making 5', act:'bonds', L:0},
  {name:'Making 10', act:'bonds', L:1},
  {name:'Adding to 10', act:'add10', L:1},
  {name:'Taking away to 10', act:'sub10', L:1},
  {name:'Crossing ten', act:'crossten', L:2},
  {name:'Taking away across ten', act:'subcross', L:2},
  {name:'Adding tens', act:'big', L:1},
  {name:'Two-digit adding', act:'big', L:2},
  {name:'Two-digit carrying', act:'big', L:3}
];
function pathStep(){
  // Carry over the old Easy/Medium/Hard/Expert choice the first time.
  if(!S.path){ S.path={step:[0,3,6,6][S.level||0],recent:[]}; save(); }
  return Math.min(S.path.step,PATH.length-1); }
function lv(){ return PATH[pathStep()].L; }
function notePath(firstTry){ if(P.act!=='learn') return; S.path.recent=(S.path.recent||[]).concat([firstTry]).slice(-15); }
function advancePath(){ const st=pathStep(), r=S.path.recent||[];
  if(st>=PATH.length-1||r.length<15||r.filter(Boolean).length<13) return null;
  S.path.step=st+1; S.path.recent=[]; save(); return PATH[st+1].name; }

// ---------- Home ----------
// Two choices only. Play is the picture path, Facts is the bare equations. Each tile says where the child is.
const STEP_GLYPH={
  howmany:()=>dieFace(5,90),
  bonds:()=>numberBond(10,7,null),
  add10:()=>numberLine(3,9,{every:1,hops:[{from:4,to:7,label:'+3'}]}),
  sub10:()=>numberLine(3,9,{every:1,hops:[{from:8,to:5,label:'−3'}]}),
  crossten:()=>numberLine(6,14,{every:2,hops:[{from:8,to:10,label:'2'},{from:10,to:13,label:'3'}]}),
  subcross:()=>numberLine(6,14,{every:2,hops:[{from:8,to:10,label:'2'},{from:10,to:13,label:'3'}]}),
  big:()=>baseTen(23,{u:9})
};
const ACTS=[
  {id:'learn', label:'Play', glyph:()=>STEP_GLYPH[PATH[pathStep()].act](), sub:()=>PATH[pathStep()].name},
  {id:'facts', label:'Facts', glyph:()=>'<svg viewBox="0 0 200 70"><text x="100" y="50" text-anchor="middle" font-family="Fredoka,sans-serif" font-size="42" font-weight="600" fill="var(--ink)">7+5 = ?</text></svg>', sub:()=>FACT_SETS[drillSet()].name}
];
function renderHome(){
  rollDay(); const done=!!S.settings.limit&&S.today.done;
  $('tiles').innerHTML=ACTS.map(a=>`<button class="tile ${done?'locked':''}" data-act="${a.id}" aria-label="${a.label}"><span class="glyph">${a.glyph()}</span><span class="label">${a.label}</span><span class="sub">${a.sub()}</span></button>`).join('');
  $('home-note').textContent=done?'Math time is finished for today.':(S.today.rounds?`${S.today.rounds} round${S.today.rounds>1?'s':''} today`:'');
  document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{ if(S.settings.limit&&S.today.done){ show('s-alldone'); return; } start(t.dataset.act); }));
}
function pointerHold(el,ms,onDone,fillEl){ let t=null,st=0,raf=null;
  const stop=()=>{ clearTimeout(t); t=null; if(raf) cancelAnimationFrame(raf); if(fillEl) fillEl.style.height='0'; };
  const tick=()=>{ if(!t) return; const p=Math.min(1,(Date.now()-st)/ms); if(fillEl) fillEl.style.height=(p*100)+'%'; raf=requestAnimationFrame(tick); };
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); st=Date.now(); t=setTimeout(()=>{ stop(); onDone(); },ms); tick(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop)); }
pointerHold($('gate'),3000,()=>openParent(),$('gate').querySelector('.fill'));
</script>
<script>
// ---------- Play engine ----------
const P={act:null,queue:[],i:0,tries:0,busy:false,enter:0,cur:null,build:0,t0:0,scaf:0,praise:0};
const ROUND_N=10;
function setTrack(){ const n=P.queue.length||1; $('track-ticks').innerHTML=Array.from({length:n},(_,i)=>`<span class="${i<P.i?'done':''}"></span>`).join(''); }
function leavePlay(){ if(P.enter){ const ms=Date.now()-P.enter; S.today.ms+=ms; const s=currentSession(); s.minutes=(s.minutes||0)+ms/60000; P.enter=0; } save(); }
$('btn-home').addEventListener('click',()=>{ leavePlay(); renderHome(); show('s-home'); });
$('btn-end-home').addEventListener('click',()=>{ renderHome(); show(S.settings.limit&&S.today.done?'s-alldone':'s-home'); });
$('btn-end-more').addEventListener('click',()=>{ renderHome(); show('s-home'); });
$('btn-alldone-home').addEventListener('click',()=>{ renderHome(); show('s-home'); });
// Process praise, tied to what the child did. Never person praise, and never every item.
const PRAISE={maketen:['you filled the ten','you knew how many were missing'],crossten:['you made a ten first','you jumped to ten, then carried on','you counted on from the bigger one'],breakapart:['you split it without counting again'],howmany:['you saw that without counting'],showme:['you built it straight off'],equals:['you checked both sides'],big:['you added the tens first','you jumped to the next ten']};

// ---------- Item generators ----------
function genHowMany(){ const L=lv(), top=[5,10,10,20][L];
  const n=rnd(1,top);
  const style=L===0?'die':(n<=6&&Math.random()<0.4?'die':(n>10||Math.random()<0.5?'frame':'dots'));
  return {kind:'howmany',n,style,flash:L>=1,answer:n,label:'how many, '+n,fact:'count:'+n}; }
function genShowMe(){ const top=[5,10,10,20][lv()]; const n=rnd(2,top); return {kind:'showme',n,answer:n,label:'show '+n,fact:'show:'+n}; }
function genMakeTen(){ const L=lv();
  if(L===0){ const a=rnd(1,4); return {kind:'maketen',target:5,a,b:5-a,answer:5-a,label:a+' and __ make 5',fact:'bond5:'+a}; }
  const a=rnd(1,9); return {kind:'maketen',target:10,a,b:10-a,answer:10-a,label:a+' and __ make 10',fact:'bond10:'+a}; }
function genBreak(){ const L=lv(), whole=L===0?rnd(3,5):L===1?rnd(4,10):rnd(6,L===2?14:20);
  const a=rnd(1,whole-1);
  // From Hard on, half of these are shown as subtraction, read as a missing addend.
  const sub=L>=2&&Math.random()<0.5;
  return {kind:'breakapart',whole,a,b:whole-a,sub,answer:whole-a,label:sub?(whole+' − '+a):(whole+' is '+a+' and __'),fact:'break:'+whole+'/'+a}; }
function genCrossTen(){ const L=lv(); let a,b;
  if(L===0){ a=rnd(1,3); b=rnd(1,5-a); } else if(L===1){ a=rnd(2,8); b=rnd(1,10-a); } else { a=rnd(5,9); b=rnd(10-a+1,9); }
  return {kind:'crossten',a,b,answer:a+b,label:a+' + '+b,fact:a+'+'+b}; }
// Taking away, written as subtraction and pictured as "a and how many more make the whole".
function genTakeAway(lo,hi){ const whole=rnd(lo,hi), a=whole>10?rnd(whole-9,9):rnd(1,whole-1);
  return {kind:'breakapart',whole,a,b:whole-a,sub:true,answer:whole-a,label:whole+' − '+a,fact:'break:'+whole+'/'+a}; }
// Equivalence: the equals sign as balance, not as "answer next". McNeil-style formats.
function genEquals(){ const L=lv(), top=L===0?5:L===1?10:L===2?14:18;
  const forms=L===0?['std','rev']:L===1?['std','rev','missA','tf']:['rev','missA','both','tf','both'];
  const form=pick(forms);
  let a=rnd(1,Math.min(9,top-2)), b=rnd(1,top-a), c=a+b;
  if(form==='std') return {kind:'equals',form,a,b,c,answer:c,label:a+' + '+b+' = __',fact:a+'+'+b};
  if(form==='rev') return {kind:'equals',form,a,b,c,answer:c,label:'__ = '+a+' + '+b,fact:a+'+'+b};
  if(form==='missA') return {kind:'equals',form,a,b,c,answer:b,label:a+' + __ = '+c,fact:a+'+'+b};
  if(form==='both'){ let d=rnd(1,c-1); if(d===a) d=d===1?2:d-1; const e=c-d;
    return {kind:'equals',form,a,b,c,d,e,answer:e,label:a+' + '+b+' = '+d+' + __',fact:a+'+'+b}; }
  const isTrue=Math.random()<0.5; const shown=isTrue?c:(c+pick([-2,-1,1,2]));
  return {kind:'equals',form:'tf',a,b,c,shown,answer:isTrue?1:0,label:a+' + '+b+' = '+shown,fact:a+'+'+b};
}
// Each game mixes item types that share a representation, rather than being one screen forever.
// How many runs both directions, name the quantity and build it. Make the number runs
// bonds to a target and the same relation split apart, which from Hard is written as subtraction.
// The advanced game. Same bridging idea, one place value up: jump the tens, then fill to
// the next ten, then the rest. Base ten blocks keep it a quantity rather than two digits.
function jumpsFor(a,b){
  const out=[]; let cur=a;
  if(b<0){ out.push({d:b,color:'var(--c9)'}); return out; }
  const tb=Math.floor(b/10), ob=b%10;
  if(tb>0){ out.push({d:tb*10,color:'var(--c9)'}); cur+=tb*10; }
  if(ob>0){ const toTen=(10-cur%10)%10;
    if(toTen>0&&ob>toTen){ out.push({d:toTen,color:'var(--accent)'}); out.push({d:ob-toTen,color:'var(--c3)'}); }
    else out.push({d:ob,color:'var(--accent)'}); }
  return out.length?out:[{d:0,color:'var(--accent)'}];
}
function genBig(){ const L=lv(); let a,b,fam;
  if(L===0){ a=rnd(2,8)*10+rnd(0,9); b=pick([10,10,-10]); fam='tens'; }
  else if(L===1){ if(Math.random()<0.35){ a=rnd(2,8)*10+rnd(0,9); b=pick([10,20,-10]); fam='tens'; }
    else { a=rnd(2,8)*10+rnd(4,9); b=rnd(10-(a%10)+1,9); fam='twodigit'; } }
  else if(L===2){ const ta=rnd(1,5),oa=rnd(1,4),tb=rnd(1,3),ob=rnd(1,9-oa); a=ta*10+oa; b=tb*10+ob; fam='twodigit'; }
  else { const ta=rnd(1,5),oa=rnd(4,9),tb=rnd(1,4),ob=rnd(10-oa+1,9); a=ta*10+oa; b=tb*10+ob; fam='carry'; }
  const answer=a+b;
  return {kind:'big',a,b,fam,answer,label:a+(b<0?' − '+Math.abs(b):' + '+b),fact:'big:'+a+(b<0?'-':'+')+Math.abs(b)};
}
// Facts: bare equations answered on a number pad, in sets that unlock in order. A fact is known
// once it is answered right first try on two different days. A miss resets it.
function factItem(op,x,y){ return op==='+'
  ? {kind:'fact',op,a:x,b:y,answer:x+y,label:x+' + '+y,fact:x+'+'+y}
  : {kind:'fact',op,m:x,s:y,answer:x-y,label:x+' − '+y,fact:x+'-'+y,fam:x>10&&x-y<10?'sub20':'sub10'}; }
const FACT_SETS=(()=>{ const sets=[[],[],[],[],[]];
  for(let a=1;a<=10;a++) for(let b=1;b<=10;b++){ const s=a+b; sets[s<=5?0:s<=10?1:3].push(factItem('+',a,b)); }
  for(let m=2;m<=20;m++) for(let s=1;s<=10;s++){ const d=m-s; if(d<1||d>10) continue; sets[m<=10?2:4].push(factItem('-',m,s)); }
  const names=['Adding within 5','Adding within 10','Taking away within 10','Adding within 20','Taking away within 20'];
  const out=sets.map((items,i)=>({name:names[i],items}));
  out.push({name:'Everything mixed',items:sets.flat()});
  return out; })();
function factDays(k){ return (S.facts[k]&&S.facts[k].dd)||[]; }
function factKnown(k){ return factDays(k).length>=2; }
function noteDrill(it,firstTry){ const f=F(it.fact);
  if(!firstTry){ f.dd=[]; return; }
  f.dd=f.dd||[]; if(!f.dd.includes(S.todayKey)) f.dd.push(S.todayKey); f.dd=f.dd.slice(-3); }
function drillSet(){ S.drill=S.drill||{set:0}; return S.drill.set; }
function setKnown(i){ return FACT_SETS[i].items.filter(x=>factKnown(x.fact)).length; }
function buildFacts(){
  const cur=drillSet(), pool=FACT_SETS[cur].items;
  const seen=k=>!!(S.facts[k]&&S.facts[k].seen);
  const due=shuffle(pool.filter(x=>S.facts[x.fact]&&S.facts[x.fact].due));
  const fresh=shuffle(pool.filter(x=>!seen(x.fact)));
  const learning=shuffle(pool.filter(x=>seen(x.fact)&&!factKnown(x.fact)&&!due.includes(x)));
  const known=shuffle(pool.filter(x=>factKnown(x.fact)&&!due.includes(x)));
  const earlier=cur>0&&cur<5?shuffle(FACT_SETS.slice(0,cur).flatMap(s=>s.items)):[];
  const nNew=earlier.length?8:ROUND_N;
  const out=[];
  for(const x of [...due,...learning.slice(0,4),...fresh,...learning.slice(4),...known]){ if(out.length>=nNew) break; if(!out.includes(x)) out.push(x); }
  const review=shuffle(earlier.filter(x=>factKnown(x.fact))).concat(shuffle(earlier)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,ROUND_N-out.length);
  const dueFirst=out.filter(x=>due.includes(x)), rest=shuffle(out.filter(x=>!due.includes(x)).concat(review));
  return dueFirst.concat(rest).map(x=>Object.assign({},x));
}
// Move on to the next set once every fact in the current one is known.
function advanceFacts(){ const cur=drillSet(); if(cur>=FACT_SETS.length-1) return null;
  if(setKnown(cur)<FACT_SETS[cur].items.length) return null;
  S.drill.set=cur+1; save(); return FACT_SETS[cur+1].name; }
// Once adding and taking away are in play, about one item in seven is an equals-sign item.
const withEq=g=>()=>Math.random()<0.15?genEquals():g();
const GEN={
  howmany:()=>Math.random()<(lv()<=1?0.4:0.3)?genShowMe():genHowMany(),
  bonds:()=>Math.random()<0.6?genMakeTen():genBreak(),
  add10:withEq(genCrossTen),
  sub10:withEq(()=>genTakeAway(3,10)),
  crossten:withEq(genCrossTen),
  subcross:withEq(()=>genTakeAway(11,18)),
  big:genBig
};
// Items missed at this step come back first in the next round of the same step.
function noteRedo(item){ if(P.act!=='learn') return; S.redo=(S.redo||[]).filter(r=>r.item.fact!==item.fact).concat([{step:pathStep(),item:Object.assign({},item)}]).slice(-30); }
function buildRound(act){
  const st=pathStep(), redo=(S.redo||[]).filter(r=>r.step===st).slice(0,3).map(r=>r.item);
  S.redo=(S.redo||[]).filter(r=>!redo.includes(r.item));
  const out=redo.slice(), seen=new Set(out.map(x=>x.fact)); let guard=0;
  while(out.length<ROUND_N&&guard++<400){ const it=GEN[act](); if(seen.has(it.fact)&&guard<120) continue; seen.add(it.fact); out.push(it); }
  return out;
}
function start(act){ rollDay(); P.act=act; P.i=0; P.busy=false; P.praise=0; P.enter=Date.now(); P.queue=act==='facts'?buildFacts():buildRound(PATH[pathStep()].act); show('s-play'); setTrack(); next(); }

// ---------- Choices ----------
function choiceRow(vals,handler,cls){
  $('bar').innerHTML=`<div class="choices">${vals.map(v=>`<button class="choice ${cls||''}" data-v="${v.v!==undefined?v.v:v}">${v.t!==undefined?v.t:v}</button>`).join('')}</div>`;
  document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>handler(b,+b.dataset.v)));
}
function options(correct,lo,hi,n){
  const out=new Set([correct]); let guard=0;
  while(out.size<n&&guard++<200){ const v=correct+pick([-2,-1,1,2,3]); if(v>=lo&&v<=hi) out.add(v); }
  while(out.size<n){ const v=rnd(lo,hi); out.add(v); }
  return [...out].sort((a,b)=>a-b);
}
function dimOthers(correct){ document.querySelectorAll('.choice').forEach(b=>{ const v=+b.dataset.v; b.classList.toggle('dim',v!==correct); if(v===correct) b.classList.add('glow'); }); }

// ---------- Answer handling ----------
// Right: the picture plays out the strategy step by step, then on by itself.
// Wrong: no buzzer, the child's answer is shown, then a second try. After a second miss the
// strategy plays out more slowly and waits for a tap, so there is time to look at it.
// redraw(value, ok, anim) returns how many seconds its animation runs.
function tapNext(){ return new Promise(res=>{ $('bar').insertAdjacentHTML('beforeend',`<button class="act go" id="mg-next" aria-label="Next">${icon('next')}</button>`); $('mg-next').addEventListener('click',res,{once:true}); }); }
async function settle(right,item,given,redraw){
  const card=$('stage').querySelector('.card'); const s=currentSession();
  const mk=item.kind; s.modes[mk]=s.modes[mk]||{n:0,first:0};
  if(right){
    const firstTry=P.tries===0, ms=Date.now()-P.t0;
    if(firstTry){ s.first++; s.modes[mk].first++; }
    s.items++; s.modes[mk].n++; noteFact(item.fact,firstTry); noteFam(item,firstTry,ms);
    if(item.kind==='fact') noteDrill(item,firstTry);
    notePath(firstTry); if(!firstTry) noteRedo(item);
    dimOthers(item.answer); card.classList.add('ok'); const dur=(redraw&&redraw(item.answer,true,{step:1.2}))||0;
    if(firstTry&&P.praise<2&&Math.random()<0.15){ P.praise++; const bank=PRAISE[item.kind]||[]; if(bank.length) note(pick(bank)); }
    await wait(Math.max(1000,dur*1000+1000)); P.i++; save(); setTrack(); next();
  } else {
    if(P.tries===0){ noteError(P.act,item,given); }
    P.tries++; card.classList.add('oops'); if(redraw) redraw(given,false);
    await wait(1000); card.classList.remove('oops');
    if(P.tries>=2){
      s.items++; s.modes[mk].n++; noteFact(item.fact,false); noteFam(item,false,0);
      if(item.kind==='fact') noteDrill(item,false);
      notePath(false); noteRedo(item);
      dimOthers(item.answer); card.classList.add('ok'); const dur=(redraw&&redraw(item.answer,true,{step:1.8}))||0;
      // Ask it again later in this round as well as at the start of the next session.
      const at=Math.min(P.queue.length,P.i+rnd(5,8));
      if(!P.queue.slice(P.i+1).some(q=>q.fact===item.fact)) P.queue.splice(at,0,Object.assign({},item));
      await wait(dur*1000+300); await tapNext(); P.i++; save(); setTrack(); next();
    } else { document.querySelectorAll('.choice').forEach(b=>{ if(+b.dataset.v===given) b.classList.add('dim'); });
      if(redraw) redraw(null,false); P.busy=false; }
  }
}
function note(t){ const el=$('mg-note'); if(el){ el.textContent=t; el.style.opacity=1; setTimeout(()=>{ if(el) el.style.opacity=0; },1800); } }
function cardHTML(inner){ return `<div class="card">${inner}<div class="pnote" id="mg-note"></div></div>`; }
function begin(){ P.t0=Date.now(); P.scaf=0; }

// ---------- Modes ----------
function next(){
  if(P.i>=P.queue.length) return endRound();
  P.cur=P.queue[P.i]; P.tries=0; P.busy=false; P.build=0; begin();
  const it=P.cur;
  ({howmany:renderHowMany,showme:renderShowMe,maketen:renderMakeTen,breakapart:renderBreak,crossten:renderCross,equals:renderEquals,big:renderBig,fact:renderFact})[it.kind](it);
}

// 1. How many? A brief look, so the child sees the group rather than counting it.
function renderHowMany(it){
  const art=()=> it.style==='die'?dieFace(it.n,150):it.style==='frame'?tenFrame(it.n,{}):dotSet(it.n,it.n>6?'pair':'plain');
  const draw=(given,ok)=>{ const e=$('mg-echo'); if(!e) return;
    e.innerHTML=(given===null||given===undefined)?'':`<div class="prompt">you said ${given}</div>`+dotSet(given,'plain'); };
  $('stage').innerHTML=cardHTML(`<div class="prompt">How many?</div><div id="mg-art">${art()}</div><div id="mg-echo"></div>`);
  if(it.flash){ setTimeout(()=>{ const a=$('mg-art'); if(a&&P.cur===it&&P.tries===0) a.innerHTML='<div class="hidden-art">?</div>'; },1700); }
  const top=Math.max(6,Math.min(20,it.n+3));
  choiceRow(options(it.n,1,top,4),(b,v)=>{ if(P.busy) return; P.busy=true; settle(v===it.n,it,v,draw); });
  if(it.flash) $('bar').insertAdjacentHTML('afterbegin',`<button class="act plain" id="mg-look" aria-label="Look again">${icon('eye')}</button>`);
  const lk=$('mg-look'); if(lk) lk.addEventListener('click',()=>{ if(P.busy) return; P.scaf++; noteScaffold(it); const a=$('mg-art'); a.innerHTML=art(); setTimeout(()=>{ if($('mg-art')&&P.cur===it) $('mg-art').innerHTML='<div class="hidden-art">?</div>'; },1500); });
}

// 2. Show me: build the number, do not pick it.
function renderShowMe(it){
  const cells=it.n>10?20:10;
  const paint=()=>{ $('mg-frame').innerHTML=tenFrame([P.build,0],{min:cells}); };
  $('stage').innerHTML=cardHTML(`<div class="prompt">Show me <b style="color:var(--accent)">${it.n}</b></div><div id="mg-frame"></div>`);
  paint();
  $('bar').innerHTML=`<div class="choices"><button class="choice wide" id="mg-less">&minus;1</button><button class="choice wide" id="mg-more">+1</button><button class="act go" id="mg-done" style="min-width:140px">${icon('check')}</button></div>`;
  const upd=d=>{ P.build=Math.max(0,Math.min(cells,P.build+d)); paint(); };
  $('mg-less').addEventListener('click',()=>{ if(!P.busy) upd(-1); });
  $('mg-more').addEventListener('click',()=>{ if(!P.busy) upd(1); });
  $('mg-done').addEventListener('click',()=>{ if(P.busy) return; P.busy=true;
    settle(P.build===it.n,it,P.build,(v)=>{ if(v===null) return; P.build=v; paint(); }); });
}

// 3. Make ten: the pairs everything else leans on.
function renderMakeTen(it){
  const T=it.target;
  const paint=(extra,ok,anim)=>{ const add=extra===null||extra===undefined?0:extra;
    const over=Math.max(0,it.a+add-T);
    $('mg-frame').innerHTML=tenFrame([it.a,Math.min(add,T-it.a)],{min:T,hide:add?undefined:it.a,anim:anim?[0.1,0]:null})+
      (over?`<div class="prompt" style="color:var(--amber)">${over} did not fit</div>`:'');
    return anim?0.1+add*0.12+0.5:0; };
  $('stage').innerHTML=cardHTML(`<div class="prompt"><b style="color:var(--accent)">${it.a}</b> so far. How many more make ${T}?</div><div id="mg-frame"></div>`);
  paint(null);
  choiceRow(options(it.b,1,T-1,4),(b,v)=>{ if(P.busy) return; P.busy=true; settle(v===it.b,it,v,paint); });
}

// 4. Break it apart, and from Hard on the same thing written as subtraction.
function renderBreak(it){
  const paint=(given,ok,anim)=>{ const b=given===null||given===undefined?null:given;
    $('mg-bond').innerHTML=numberBond(it.whole,it.a,b);
    $('mg-frame').innerHTML=tenFrame([it.a,b===null?0:b],{min:it.whole>10?20:10,anim:anim?[0.1,0]:null});
    return anim&&b?0.1+b*0.12+0.5:0; };
  const head=it.sub
    ? `<div class="eq"><span>${it.whole}</span><span class="op">&minus;</span><span>${it.a}</span><span class="op">=</span><span class="box">?</span></div><div class="prompt">${it.a} and how many more make ${it.whole}?</div>`
    : `<div class="prompt"><b style="color:var(--accent)">${it.whole}</b> is ${it.a} and how many?</div>`;
  $('stage').innerHTML=cardHTML(`${head}<div id="mg-bond"></div><div id="mg-frame"></div>`);
  paint(null);
  choiceRow(options(it.b,1,it.whole-1,4),(b,v)=>{ if(P.busy) return; P.busy=true; settle(v===it.b,it,v,paint); });
}

// 5. Cross ten: fill the ten, then carry on. The strategy, made visible.
function renderCross(it){
  const need=10-it.a, rest=it.b-need, crosses=rest>0;
  // The strategy is drawn only for the right answer: fill to ten with the first hop, then the rest.
  // A wrong answer just marks where the child landed, so the second try is still a try.
  const paint=(given,ok,anim)=>{
    const total=given===null||given===undefined?null:given, show=total!==null&&ok, T=anim?anim.step:0;
    const hops=[{from:it.a,to:Math.min(10,it.a+it.b),label:'+'+Math.min(need,it.b),color:'var(--c9)',d:anim?0:undefined}];
    if(crosses) hops.push({from:10,to:it.a+it.b,label:'+'+rest,color:'var(--accent)',d:anim?T:undefined});
    const end=hops.length*T;
    $('mg-line').innerHTML=numberLine(Math.max(0,it.a-1),Math.max(it.a+it.b+1,12),{every:1,hops:show?hops:[],mark:total===null?it.a:total,markD:show&&anim?end:undefined});
    $('mg-frame').innerHTML=tenFrame(show?[it.a,Math.min(it.b,need),crosses?rest:0]:[it.a,0],{min:it.a+it.b>10?20:10,c2:'var(--c9)',c3:'var(--accent)',anim:show&&anim?[0.1,T+0.1]:null});
    const bx=$('mg-box'); if(bx){ bx.classList.toggle('filled',total!==null);
      if(show&&anim) bx.innerHTML=`<span class="rv" style="--d:${end}s">${total}</span>`; else bx.textContent=total===null?'?':total; }
    return show&&anim?end+0.5:0; };
  $('stage').innerHTML=cardHTML(`<div class="eq"><span>${it.a}</span><span class="op">+</span><span>${it.b}</span><span class="op">=</span><span class="box" id="mg-box">?</span></div><div id="mg-frame"></div><div id="mg-line"></div>`);
  paint(null);
  choiceRow(options(it.answer,Math.max(2,it.answer-4),it.answer+4,4),(b,v)=>{ if(P.busy) return; P.busy=true; settle(v===it.answer,it,v,paint); });
}

// 7. Is it true? The equals sign as balance rather than "the answer comes next".
function renderEquals(it){
  const boxed=v=>`<span class="box ${v===null?'':'filled'}" id="mg-box">${v===null?'?':v}</span>`;
  const line=v=>{
    if(it.form==='std') return `<span>${it.a}</span><span class="op">+</span><span>${it.b}</span><span class="op">=</span>${boxed(v)}`;
    if(it.form==='rev') return `${boxed(v)}<span class="op">=</span><span>${it.a}</span><span class="op">+</span><span>${it.b}</span>`;
    if(it.form==='missA') return `<span>${it.a}</span><span class="op">+</span>${boxed(v)}<span class="op">=</span><span>${it.c}</span>`;
    if(it.form==='both') return `<span>${it.a}</span><span class="op">+</span><span>${it.b}</span><span class="op">=</span><span>${it.d}</span><span class="op">+</span>${boxed(v)}`;
    return `<span>${it.a}</span><span class="op">+</span><span>${it.b}</span><span class="op">=</span><span>${it.shown}</span>`;
  };
  const paint=(given)=>{
    const v=given===null||given===undefined?null:given;
    $('mg-eq').innerHTML=line(it.form==='tf'?null:v);
    if(it.form==='tf'){ $('mg-frame').innerHTML=v===null?'':tenFrame([it.a,it.b],{min:Math.max(10,it.a+it.b>10?20:10),c2:'var(--c9)'})+`<div class="prompt">${it.a} and ${it.b} is ${it.c}</div>`; }
    else if(it.form==='both'){ $('mg-frame').innerHTML=`<div class="twoside">${tenFrame([it.a,it.b],{min:10,c2:'var(--c9)'})}${v===null?'':tenFrame([it.d,v],{min:10,c2:'var(--c9)'})}</div>`; }
    else { $('mg-frame').innerHTML=v===null?'':tenFrame([it.a,it.form==='missA'?v:0],{min:Math.max(10,it.c>10?20:10),c2:'var(--c9)'}); } };
  const q=it.form==='tf'?'Is it true?':it.form==='both'?'Make both sides the same':'What goes in the box?';
  $('stage').innerHTML=cardHTML(`<div class="prompt">${q}</div><div class="eq" id="mg-eq"></div><div id="mg-frame"></div>`);
  paint(null);
  if(it.form==='tf') choiceRow([{v:1,t:'true'},{v:0,t:'false'}],(b,v)=>{ if(P.busy) return; P.busy=true; settle(v===it.answer,it,v,paint); },'wide');
  else choiceRow(options(it.answer,1,Math.max(4,it.answer+4),4),(b,v)=>{ if(P.busy) return; P.busy=true; settle(v===it.answer,it,v,paint); });
}

// 8. Bigger numbers: two digit work on base ten blocks and an open number line.
function renderBig(it){
  const paint=(given,ok,anim)=>{
    const v=given===null||given===undefined?null:given, show=v!==null&&ok, jumps=jumpsFor(it.a,it.b), T=anim?anim.step:0, end=jumps.length*T;
    const bx=$('mg-box'); if(bx){ bx.classList.toggle('filled',v!==null);
      if(show&&anim) bx.innerHTML=`<span class="rv" style="--d:${end}s">${v}</span>`; else bx.textContent=v===null?'?':v; }
    $('mg-blocks').innerHTML=show?'':`<div class="btrow">${baseTen(it.a,{color:'var(--c9)',oneColor:'var(--c5)'})}<span class="op">${it.b<0?'−':'+'}</span>${baseTen(Math.abs(it.b),{color:'var(--c3)',oneColor:'var(--c5)'})}</div>`;
    $('mg-open').innerHTML=show?openLine(it.a,jumps,anim?T:null):'';
    return show&&anim?end+0.5:0; };
  $('stage').innerHTML=cardHTML(`<div class="eq"><span>${it.a}</span><span class="op">${it.b<0?'−':'+'}</span><span>${Math.abs(it.b)}</span><span class="op">=</span><span class="box" id="mg-box">?</span></div><div id="mg-blocks"></div><div id="mg-open"></div>`);
  paint(null);
  // One distractor is the answer with the carry dropped, which is the classic slip.
  const opts=new Set([it.answer, it.answer-10, it.answer+1, it.answer-1]);
  const arr=[...opts].filter(v=>v>0).slice(0,4).sort((x,y)=>x-y);
  while(arr.length<4){ const v=it.answer+rnd(-3,3); if(v>0&&!arr.includes(v)) arr.push(v); arr.sort((x,y)=>x-y); }
  choiceRow(arr,(b,v)=>{ if(P.busy) return; P.busy=true; settle(v===it.answer,it,v,paint); });
}

// The picture for a missed fact. Without show it is a hint with no answer on it. With show the
// strategy plays out in steps T seconds apart. Returns {html, dur}.
// Adding: fill the ten first, then the rest. Taking away within ten: cross the counters out.
// Taking away across ten: count up, "8 and how many make 13", through ten.
function factPic(it,show,T){
  const rv=d=>` class="rv" style="--d:${d}s"`;
  if(it.op==='+'){ const a=it.a,b=it.b,sum=a+b,need=10-a,crosses=a<10&&sum>10;
    const frame=tenFrame([a,crosses?need:b,crosses?sum-10:0],{min:sum>10?20:10,c2:'var(--c9)',c3:'var(--accent)',anim:show?[0.1,T+0.1]:null});
    if(!show) return {html:frame,dur:0};
    const hops=crosses?[{from:a,to:10,label:'+'+need,color:'var(--c9)',d:0},{from:10,to:sum,label:'+'+(sum-10),color:'var(--accent)',d:T}]:[{from:a,to:sum,label:'+'+b,color:'var(--c9)',d:0}];
    return {html:frame+numberLine(Math.max(0,a-1),sum+1,{every:1,hops,mark:sum,markD:hops.length*T}),dur:hops.length*T+0.5}; }
  const m=it.m,s=it.s,d=m-s;
  if(m<=10){ const frame=tenFrame(m,{min:10,cross:s,crossD:show?0.1:undefined});
    if(!show) return {html:frame,dur:0};
    return {html:frame+numberLine(Math.max(0,d-1),m+1,{every:1,hops:[{from:m,to:d,label:'−'+s,color:'var(--accent)',d:0}],mark:d,markD:T}),dur:T+0.5}; }
  const toTen=10-s, rest=m-10, two=s<10;
  const frame=tenFrame(two?[s,toTen,rest]:[s,m-s],{min:20,c2:'var(--c9)',c3:'var(--accent)',anim:show?[0.1,T+0.1]:null});
  const ask=`<div class="prompt">${s} and how many make ${m}?</div>`;
  if(!show) return {html:ask+frame,dur:0};
  const hops=two?[{from:s,to:10,label:'+'+toTen,color:'var(--c9)',d:0},{from:10,to:m,label:'+'+rest,color:'var(--accent)',d:T}]:[{from:s,to:m,label:'+'+(m-s),color:'var(--c9)',d:0}];
  const end=hops.length*T;
  return {html:ask+frame+numberLine(Math.max(0,s-1),m+1,{every:1,hops})+(two?`<div class="prompt"${rv(end)}>${toTen} and ${rest} make ${d}</div>`:''),dur:end+0.5};
}
// 9. Facts: the bare equation, answered on a number pad so the answer is recalled, not picked.
// A first miss brings up the picture as a hint. A second miss plays the strategy out with the answer.
function renderFact(it){
  let entry='';
  const upd=()=>{ const bx=$('mg-box'); bx.classList.remove('wrong'); bx.classList.toggle('filled',!!entry); bx.innerHTML=entry||'&nbsp;'; };
  const pic=(show,T)=>{ const r=factPic(it,show,T); $('mg-pic').innerHTML=r.html; return r.dur; };
  const draw=(given,ok,anim)=>{ const bx=$('mg-box'); if(!bx) return 0;
    if(given===null||given===undefined){ entry=''; upd(); if(P.tries>0) pic(false); return 0; }
    bx.classList.add('filled'); bx.classList.toggle('wrong',!ok);
    if(ok&&P.tries>0){ const dur=pic(true,anim?anim.step:1.2);
      if(P.tries>=2) bx.innerHTML=`<span class="rv" style="--d:${Math.max(0,dur-0.5)}s">${given}</span>`; else bx.textContent=given;
      return dur; }
    bx.textContent=given; return 0; };
  const q=it.op==='+'?`<span>${it.a}</span><span class="op">+</span><span>${it.b}</span>`:`<span>${it.m}</span><span class="op">&minus;</span><span>${it.s}</span>`;
  $('stage').innerHTML=cardHTML(`<div class="eq">${q}<span class="op">=</span><span class="box" id="mg-box">&nbsp;</span></div><div id="mg-pic"></div>`);
  const key=d=>`<button class="key" data-k="${d}">${d}</button>`;
  $('bar').innerHTML=`<div class="pad">${[1,2,3,4,5].map(key).join('')}<button class="key del" data-k="del" aria-label="Delete">&#9003;</button>${[6,7,8,9,0].map(key).join('')}<button class="key ok" data-k="ok" aria-label="Check">${icon('check')}</button></div>`;
  document.querySelectorAll('.key').forEach(b=>b.addEventListener('click',()=>{ if(P.busy) return; const k=b.dataset.k;
    if(k==='del'){ entry=entry.slice(0,-1); upd(); return; }
    if(k==='ok'){ if(!entry) return; P.busy=true; const v=+entry; settle(v===it.answer,it,v,draw); return; }
    if(entry.length<2){ entry=(entry==='0'?'':entry)+k; upd(); } }));
}
document.addEventListener('keydown',e=>{ if(!P.cur||P.cur.kind!=='fact'||!$('s-play').classList.contains('on')) return;
  const k=/^[0-9]$/.test(e.key)?e.key:e.key==='Backspace'?'del':e.key==='Enter'?'ok':null;
  const b=k&&document.querySelector(`.key[data-k="${k}"]`); if(b){ e.preventDefault(); b.click(); } });

// ---------- Round end ----------
function endRound(){
  leavePlay(); S.today.rounds++; save();
  const over=!!S.settings.limit&&(S.today.rounds>=6||S.today.ms>=24*60*1000); if(over){ S.today.done=true; save(); }
  $('end-art').innerHTML=trophyArt(); $('alldone-art').innerHTML=rodStack();
  $('end-title').textContent=over?'That is the lot for today.':'Round finished.';
  $('end-text').textContent='';
  if(P.act==='facts'){ const unlocked=advanceFacts(), cur=drillSet(), set=FACT_SETS[cur];
    $('end-text').textContent=unlocked?`New facts: ${unlocked}.`:cur<FACT_SETS.length-1?`${set.name}: ${setKnown(cur)} of ${set.items.length} facts known.`:''; }
  if(P.act==='learn'){ const nxt=advancePath(); $('end-text').textContent=nxt?`Next time: ${nxt}.`:''; }
  $('btn-end-more').hidden=over; show('s-end');
}
</script>
<script>
// ---------- Grown-ups ----------
function openParent(){ show('s-parent'); renderHow(); renderProgress(); renderFacts(); renderSettings(); }
$('btn-parent-close').addEventListener('click',()=>{ renderHome(); show('s-home'); });
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t)); document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+t.dataset.pane)); }));

function renderHow(){
  $('pane-how').innerHTML=`<h2>How to play</h2>
  <p>Two buttons. <b>Play</b> is the picture games, and <b>Facts</b> is plain sums on a number pad. Each button shows where the child is, and both move on by themselves. There is no score, no timer and no wrong buzzer.</p>
  <h3>Play</h3>
  <p>One kind of question at a time, in this order: ${PATH.map(p=>p.name.toLowerCase()).join(', ')}. The child moves to the next step after 13 first-try answers in the last 15. Every answer is shown in a picture, a ten frame, a number line or a number bond, and the picture plays out the strategy step by step: for eight plus five, the frame fills to ten first and the line shows two hops, the jump to ten and then the rest. After two misses the picture plays slowly and waits for a tap. Anything missed comes back in the next round.</p>
  <p>Taking away is written as subtraction and pictured as the missing part, so thirteen minus eight is shown as eight and how many more make thirteen. From adding to ten on, about one question in seven writes the equals sign the other way round, such as 7 = 4 + 3, because children who read equals as "the answer comes next" struggle with algebra later.</p>
  <h3>Facts</h3>
  <p>A bare sum, typed on a number pad so the answer has to be remembered rather than picked from a list. The sets run adding within 5, adding within 10, taking away within 10, adding within 20, taking away within 20, then everything mixed. A fact counts as known when it has been answered right on the first try on two different days. After a first miss a picture appears as a hint, and after a second the picture shows the answer and waits for a tap.</p>
  <h3>Sitting with them</h3>
  <p>Ask how they knew, not whether they are sure. If they count every counter from one, point at the filled ten and ask whether they need to start again. Counting on from the larger number, then bridging through ten, is the progression to listen for.</p>
  <p>When they are stuck, show the objects rather than explaining the rule, and stop after a few minutes. A short cheerful session beats a long corrective one.</p>`;
}

function renderProgress(){
  const week=S.sessions.filter(s=>daysSince(s.date)<7); const mins=Math.round(week.reduce((a,s)=>a+(s.minutes||0),0));
  const pct=(o,n)=>n?Math.round(100*o/n)+'%':'-';
  const rows=S.sessions.slice(-12).reverse();
  const modeName={howmany:'How many',showme:'Show me',maketen:'Making 5 and 10',breakapart:'Parts and taking away',crossten:'Adding with pictures',equals:'Equals sign',big:'Bigger numbers',fact:'Facts',bonds:'Make the number (old)',facts:'Facts (old)',rods:'Rods (old)'};
  const byMode={}; S.sessions.forEach(s=>Object.entries(s.modes||{}).forEach(([m,v])=>{ byMode[m]=byMode[m]||{n:0,first:0}; byMode[m].n+=v.n; byMode[m].first+=v.first; }));
  $('pane-progress').innerHTML=`<h2>Progress</h2>
  <p>${mins} minute${mins===1?'':'s'} in the last seven days across ${week.length} day${week.length===1?'':'s'}. Play is on step ${pathStep()+1} of ${PATH.length}, ${PATH[pathStep()].name.toLowerCase()}, with ${(S.path.recent||[]).filter(Boolean).length} first-try answers in the last ${(S.path.recent||[]).length} (13 of 15 moves on). The figure to watch is first-try, which counts only the answers given without a second look.</p>
  <h3>By kind of question, all time</h3>${Object.keys(byMode).length?`<table><tr><th>Kind</th><th>Answers</th><th>First try</th></tr>${Object.entries(byMode).map(([m,v])=>`<tr><td>${modeName[m]||m}</td><td>${v.n}</td><td>${pct(v.first,v.n)}</td></tr>`).join('')}</table>`:'<p class="note">Nothing yet.</p>'}
  <h3>Sessions</h3>${rows.length?`<table><tr><th>Date</th><th>Answers</th><th>First try</th><th>Minutes</th></tr>${rows.map(s=>`<tr><td>${s.date}</td><td>${s.items}</td><td>${pct(s.first,s.items)}</td><td>${Math.round(s.minutes||0)}</td></tr>`).join('')}</table>`:'<p class="note">No sessions yet.</p>'}`;
}

const OFFSCREEN=[
 'Put out seven buttons and ask how many more make ten.',
 'Lay the table and ask how many more forks are needed.',
 'Count the stairs going up, then count back down.',
 'Roll two dice and ask for the total without counting the pips one at a time.',
 'Ask what nine and six is, then ask how they worked it out.',
 'Hold up some fingers on both hands and ask how many are folded down.',
 'Share out grapes between two people and ask if it is fair.',
 'Ask how many wheels on three bicycles.',
 'Say a number and ask for the one that makes ten with it, back and forth in the car.',
 'Build a tower of ten bricks, take some away behind your back, and ask how many are hidden.'];
function renderFacts(){
  const f=k=>S.facts[k];
  const cls=k=>{ const x=f(k); if(!x||!x.seen) return 'k0'; const r=x.first/x.seen; return r>=0.9?'k3':r>=0.6?'k2':'k1'; };
  const title=k=>{ const x=f(k); return x?`${x.first} of ${x.seen} first try`:'not seen yet'; };
  let grid='';
  for(let a=1;a<=10;a++) for(let b=1;b<=10;b++){ const k=a+'+'+b; grid+=`<div class="${cls(k)}" title="${a} + ${b}, ${title(k)}">${a}+${b}</div>`; }
  let bonds=''; for(let a=1;a<=9;a++){ const k='bond10:'+a; bonds+=`<div class="${cls(k)}" title="${a} and ${10-a}, ${title(k)}">${a}+${10-a}</div>`; }
  const errs={}; S.errors.forEach(e=>{ errs[e.k]=(errs[e.k]||0)+1; });
  const top=Object.entries(errs).sort((x,y)=>y[1]-x[1]);
  const recent=S.errors.slice(-14).reverse();
  const crossing=S.errors.filter(e=>e.k==='crossing-ten'||e.k==='off-by-one-crossing'||e.k==='stopped-at-ten').length;
  const cur=drillSet();
  $('pane-facts').innerHTML=`<h2>Facts practice</h2>
  <p>The Facts game works through these sets in order. A fact counts as known once it has been answered right on the first try on two different days, and a miss resets it. The next set opens when every fact in the current one is known.</p>
  <table><tr><th>Set</th><th>Known</th></tr>${FACT_SETS.slice(0,-1).map((st,i)=>`<tr><td>${i===cur?'<b>'+st.name+'</b> (now)':st.name}</td><td>${setKnown(i)} of ${st.items.length}</td></tr>`).join('')}${cur===FACT_SETS.length-1?'<tr><td><b>Everything mixed</b> (now)</td><td></td></tr>':''}</table>
  <h2>Fact map</h2>
  <p>Every addition pair to ten plus ten. Green means answered first try almost every time, amber means mixed, red means usually needed a second look, grey means not yet seen. Hover or long press a square to see the counts.</p>
  <div class="factgrid" style="grid-template-columns:repeat(10,1fr);max-width:640px">${grid}</div>
  <h3>Pairs that make ten</h3>
  <div class="factgrid" style="grid-template-columns:repeat(9,1fr);max-width:580px">${bonds}</div>
  <h3>By strategy group</h3>
  ${Object.keys(S.fam).length?`<table><tr><th>Group</th><th>Answers</th><th>First try</th><th>Typical time</th><th>Looked again</th></tr>${Object.entries(S.fam).sort((a,b)=>(a[1].first/Math.max(1,a[1].n))-(b[1].first/Math.max(1,b[1].n))).map(([k,v])=>{ const md=medianMs(v.ms); return `<tr><td>${FAM_LABEL[k]||k}</td><td>${v.n}</td><td>${v.n?Math.round(100*v.first/v.n)+'%':'-'}</td><td>${md?(md/1000).toFixed(1)+'s':'-'}</td><td>${v.scaf||0}</td></tr>`; }).join('')}</table>
  <p class="note">Worst first. Time is not a score. A group that is accurate but slow means the child is still working the answer out, which is the normal stage before simply knowing it. A group that is accurate but often needed a second look is not secure yet.</p>`:'<p class="note">Nothing yet.</p>'}
  <h3>Error patterns</h3>
  ${top.length?`<table><tr><th>Pattern</th><th>Times</th></tr>${top.map(([k,n])=>`<tr><td>${ERR_LABEL[k]||k}</td><td>${n}</td></tr>`).join('')}</table>
  <p class="note">${crossing?`${crossing} of the misses happened while crossing ten. That is the place to spend time: practise the pairs that make ten first, then Cross ten.`:'No clear crossing-ten pattern yet.'}</p>`:'<p class="note">No errors recorded yet.</p>'}
  <h3>Most often missed</h3>
  ${(()=>{ const c={}; S.errors.forEach(e=>{ if(e.q) c[e.q]=(c[e.q]||0)+1; });
    const t=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return t.length?`<p>${t.map(([q,n])=>`<b>${q}</b> missed ${n} time${n>1?'s':''}`).join('. ')}.</p>`:'<p class="note">Nothing stands out yet.</p>'; })()}
  <h3>Last few misses</h3>
  ${recent.length?`<table><tr><th>Date</th><th>Question</th><th>Said</th><th>Was</th><th>Looks like</th></tr>${recent.map(e=>`<tr><td>${e.d}</td><td>${e.q}</td><td>${e.g}</td><td>${e.c}</td><td>${ERR_LABEL[e.k]||e.k}</td></tr>`).join('')}</table>`:'<p class="note">Nothing to show.</p>'}
  <h3>Try away from the screen</h3>
  <p>${OFFSCREEN[(S.tipIdx||0)%OFFSCREEN.length]}</p>
  <p><button class="pbtn" id="fact-tip">Another one</button></p>`;
  const tb=$('fact-tip'); if(tb) tb.addEventListener('click',()=>{ S.tipIdx=((S.tipIdx||0)+1)%OFFSCREEN.length; save(); renderFacts(); });
}

function renderSettings(){
  $('pane-settings').innerHTML=`<h2>Settings</h2>
  <div class="field"><label>Play step</label><select id="set-step">${PATH.map((p,i)=>`<option value="${i}" ${i===pathStep()?'selected':''}>${i+1}. ${p.name}</option>`).join('')}</select></div>
  <div class="field"><label>Facts set</label><select id="set-fset">${FACT_SETS.map((f,i)=>`<option value="${i}" ${i===drillSet()?'selected':''}>${i+1}. ${f.name}</option>`).join('')}</select></div>
  <p class="note">Both move on by themselves. Change them only if the child is clearly in the wrong place.</p>
  <div class="field"><label>Daily limit</label><button class="pbtn ${S.settings.limit?'on':''}" id="set-limit">${S.settings.limit?'On: six rounds or 24 minutes':'Off'}</button></div>
  <div class="field"><button class="pbtn" id="set-more">Allow one more round today</button><span class="note">${S.settings.limit&&S.today.done?'Today is marked finished.':'Today is not finished.'}</span></div>
  <h3>On the iPad</h3><p>Open in Safari, tap Share, then Add to Home Screen. Everything stays on the device. Nothing is uploaded and there is no account.</p>
  <h3>Data</h3><div class="field"><button class="pbtn" id="set-export">Copy all data</button><button class="pbtn warn" id="set-reset">Hold to erase everything</button></div>`;
  $('set-step').addEventListener('change',e=>{ pathStep(); S.path.step=+e.target.value; S.path.recent=[]; save(); renderHome(); });
  $('set-fset').addEventListener('change',e=>{ drillSet(); S.drill.set=+e.target.value; save(); renderHome(); });
  $('set-limit').addEventListener('click',()=>{ S.settings.limit=!S.settings.limit; if(!S.settings.limit) S.today.done=false; save(); renderSettings(); });
  $('set-more').addEventListener('click',()=>{ rollDay(); S.today.done=false; S.today.rounds=Math.min(S.today.rounds,5); S.today.ms=Math.min(S.today.ms,20*60*1000); save(); toast('One more round allowed.'); renderSettings(); });
  $('set-export').addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(S,null,1)); toast('Copied.'); }catch(e){ toast('Could not copy.'); } });
  pointerHold($('set-reset'),3000,()=>{ localStorage.removeItem(KEY); S=JSON.parse(JSON.stringify(DEFAULT)); save(); toast('Erased.'); openParent(); renderHome(); });
}

rollDay(); renderHome(); show('s-home');
</script>
