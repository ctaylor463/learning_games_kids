:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --ground:#F3F0E6; --card:#FFFFFF; --ink:#23303F; --ink-soft:#66717F; --line:#D8D3C5;
  --accent:#E4572E; --sun:#F5C242; --leaf:#3E9B5F; --amber:#E0A13A; --sky:#CFE3F5;
  --name:#4C7DD1; --name-soft:#DCE8FA; --leaf-soft:#D8F0E0; --amber-soft:#FBE8D2;
  --shadow:0 6px 24px rgba(35,48,63,.10);
  --f-read:'ABeeZee','Andika','Trebuchet MS','Verdana',sans-serif;
  --f-ui:'Fredoka','ABeeZee','Trebuchet MS',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#171C22; --card:#232B35; --ink:#EEF1F4; --ink-soft:#A9B2BD; --line:#3B4552;
    --accent:#F07A55; --sun:#F5C242; --leaf:#5DBA7A; --amber:#E8B04C; --sky:#2B3D50;
    --name:#7AA3E6; --name-soft:#26364D; --leaf-soft:#22463A; --amber-soft:#47382A;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#171C22; --card:#232B35; --ink:#EEF1F4; --ink-soft:#A9B2BD; --line:#3B4552;
  --accent:#F07A55; --sun:#F5C242; --leaf:#5DBA7A; --amber:#E8B04C; --sky:#2B3D50;
  --name:#7AA3E6; --name-soft:#26364D; --leaf-soft:#22463A; --amber-soft:#47382A;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-read);font-size:18px;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--name);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.strip{display:flex;align-items:center;gap:12px;padding:max(10px,var(--sat)) max(14px,var(--sar)) 10px max(14px,var(--sal));min-height:64px}
.iconbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:30px;height:30px}
.iconbtn.small{width:44px;height:44px}
.iconbtn.small svg{width:22px;height:22px}
.skyline{flex:1;height:44px;position:relative;border-radius:22px;background:var(--sky);overflow:hidden}
.skyline .kite{position:absolute;left:4%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;transition:left .5s ease}
.skyline .kite svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion: reduce){.skyline .kite{transition:none}.word .g{transition:none}.tile{transition:none}}

.home{flex:1;display:flex;flex-direction:column;padding:max(6px,var(--sat)) max(18px,var(--sar)) max(18px,var(--sab)) max(18px,var(--sal));gap:14px;min-height:0}
.hometop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%}
.brand{font-family:var(--f-ui);font-weight:600;font-size:30px;text-wrap:balance}
.brand small{display:block;font-family:var(--f-read);font-weight:400;font-size:15px;color:var(--ink-soft);margin-top:2px}
.levels{display:flex;gap:12px}
.lvl{flex:1;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:4px solid transparent;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.lvl.on{border-color:var(--accent)}
.lvl .kites{display:flex;gap:2px}
.lvl .kites svg{width:24px;height:24px}
.choice.longword{font-size:min(6vw,40px)}
.choice.onsetopt{font-weight:700;padding:8px 10px;white-space:nowrap}
.choice.onsetopt .rest{color:var(--ink-soft);opacity:.6;font-weight:400}
.word.long{font-size:min(12vw,80px)}
.lvl .lab{font-family:var(--f-ui);font-size:14px;color:var(--ink-soft)}
.lvl.on .lab{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:1;min-height:0}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.choice.vowelopt{flex-direction:column;gap:2px;padding:10px 12px;min-height:130px}
.choice.vowelopt .v{font-weight:700;font-size:min(12vw,64px);line-height:1}
.choice.vowelopt .kw{font-size:min(7vw,36px);line-height:1}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;border:4px solid transparent;min-height:140px}
.tile:active{transform:scale(.98)}
.tile .glyph{font-size:64px;line-height:1;display:flex;align-items:center;gap:10px}
.tile .glyph .w{font-family:var(--f-read);font-size:40px;font-weight:700;color:var(--accent)}
.tile .glyph .arrow{font-size:28px;color:var(--ink-soft)}
.tile .label{font-family:var(--f-ui);font-size:19px;color:var(--ink)}
.tile.locked{opacity:.45}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gate{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;overflow:hidden}
.gate svg{width:26px;height:26px;position:relative}
.gate .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sky)}
.done-note{font-size:15px;color:var(--ink-soft)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px 18px;min-height:0;gap:16px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);width:100%;max-width:760px;min-height:220px;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;border:6px solid transparent;transition:border-color .3s}
.card.ok{border-color:var(--leaf)}
.card.oops{border-color:var(--amber)}
.pic{font-size:min(28vw,150px);line-height:1}
.word{font-size:min(20vw,128px);line-height:1.15;display:flex;gap:.02em;justify-content:center;transition:gap .5s ease}
.word.split{gap:.5em}
.word .g{padding:0 .04em;border-radius:.12em;transition:background .2s;position:relative}
.word .g.lit{background:var(--sun)}
.word .g.silent{color:var(--ink-soft);opacity:.55}
.word .g.rest{color:var(--ink-soft);opacity:.6}
.word .g.blank{border-bottom:.08em solid var(--ink);min-width:.6em}
.word.small{font-size:min(13vw,78px);font-weight:700}
.slot.rest{color:var(--ink-soft);border-style:solid;border-color:var(--line);background:transparent}
.slot.wide,.tile-l.wide{width:auto;min-width:min(16vw,88px);padding:0 16px}
.word.split .g:not(:last-child)::after{content:'';position:absolute;right:-.3em;top:55%;width:.12em;height:.12em;border-radius:50%;background:var(--ink-soft)}
.choices{display:flex;gap:16px;width:100%;max-width:820px;justify-content:center;flex-wrap:wrap}
.choice{flex:1;min-width:140px;max-width:260px;min-height:120px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:min(9vw,60px);border:5px solid transparent;transition:border-color .2s,opacity .2s,transform .1s}
.choice.pic{font-size:min(18vw,96px)}
.choice:active{transform:scale(.97)}
.choice.glow{border-color:var(--leaf);background:var(--leaf-soft)}
.choice.dim{opacity:.35}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:100%}
.slot{width:min(16vw,88px);height:min(16vw,88px);border-radius:16px;border:4px dashed var(--line);display:grid;place-items:center;font-size:min(10vw,58px);font-weight:700;background:rgba(0,0,0,.02)}
.slot.filled{border-style:solid;border-color:var(--name);background:var(--name-soft)}
.slot.lit{background:var(--sun);border-color:var(--sun)}
.tiles-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%;max-width:820px}
.tile-l{width:min(17vw,96px);height:min(17vw,96px);border-radius:18px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:min(10vw,58px);font-weight:700;border:4px solid transparent;transition:transform .12s,opacity .2s,border-color .2s}
.tile-l:active{transform:scale(.95)}
.tile-l.used{opacity:.25;pointer-events:none}
.tile-l.hint{border-color:var(--sun);animation:pulse 1s ease-in-out infinite}
.tile-l.shake{animation:shake .35s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar{display:flex;justify-content:center;gap:22px;padding:12px 18px max(22px,var(--sab));align-items:center}
.act{height:80px;min-width:150px;padding:0 30px;border-radius:40px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-ui);font-weight:600;font-size:22px;box-shadow:var(--shadow)}
.act svg{width:36px;height:36px}
.act.hear{background:var(--card);color:var(--ink)}
.act.next{background:var(--name);color:#fff;min-width:210px}
.act[disabled]{opacity:.35;pointer-events:none}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.center h1{font-family:var(--f-ui);font-weight:600;font-size:34px;margin:0;text-wrap:balance}
.center p{margin:0;color:var(--ink-soft);max-width:34em}
.bigkite{width:min(50vw,260px);height:min(50vw,260px)}
.bigkite svg{width:100%;height:100%}

.parent{flex:1;display:flex;flex-direction:column;min-height:0;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.tab{font-family:var(--f-ui);font-weight:600;font-size:16px;padding:10px 16px;border-radius:999px;background:var(--card);color:var(--ink-soft);white-space:nowrap}
.tab.on{background:var(--ink);color:var(--ground)}
.pane{display:none;flex:1;overflow:auto;padding:0 18px 28px;min-height:0}
.pane.on{display:block}
.pane h2{font-family:var(--f-ui);font-weight:600;font-size:22px;margin:18px 0 8px}
.pane h3{font-family:var(--f-ui);font-weight:600;font-size:15px;margin:16px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.pane p,.pane li{font-size:16px;line-height:1.5;max-width:64ch}
.pane table{border-collapse:collapse;width:100%;max-width:720px;font-size:15px;font-variant-numeric:tabular-nums}
.pane th,.pane td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.pane th{font-family:var(--f-ui);font-weight:600;color:var(--ink-soft);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.pbtn{font-family:var(--f-ui);font-weight:600;font-size:16px;padding:12px 18px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin:4px 6px 4px 0;min-height:48px}
.pbtn.warn{background:var(--amber);color:#1B2A41}
.pbtn.on{outline:3px solid var(--name)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tipcard{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.tipcard b{font-family:var(--f-ui);display:block;margin-bottom:4px}
.field{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.note{font-size:15px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>

<div id="app">
<section class="screen on" id="s-home">
  <div class="home">
    <div class="hometop">
      <div class="brand">Reading Game<small>Pictures and words</small></div>
      <div style="display:flex;gap:12px">
        <a class="iconbtn" href="../" aria-label="All games" title="All games" style="color:inherit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></a>
        <button class="iconbtn" id="btn-fs" data-fs-btn aria-label="Toggle full screen"><span data-icon="fullscreen"></span></button>
      </div>
    </div>
    <div class="levels" id="levels"></div>
    <div class="tiles" id="tiles"></div>
    <div class="homefoot"><span class="done-note" id="home-note"></span><button class="gate" id="gate" aria-label="Grown-ups: hold for three seconds"><span class="fill"></span><span data-icon="lock"></span></button></div>
  </div>
</section>
<section class="screen" id="s-play">
  <div class="strip"><button class="iconbtn" id="btn-home" aria-label="Home"><span data-icon="home"></span></button><div class="skyline"><div class="kite" id="kite"><span data-icon="kite"></span></div></div><button class="iconbtn" id="btn-play-fs" data-fs-btn aria-label="Toggle full screen"><span data-icon="fullscreen"></span></button></div>
  <div class="stage" id="stage"></div>
  <div class="bar" id="bar"></div>
</section>
<section class="screen" id="s-end">
  <div class="center"><div class="bigkite"><span data-icon="kite"></span></div><h1 id="end-title">The kite flew high.</h1><p id="end-text"></p>
    <div class="bar" style="padding-bottom:0"><button class="act hear" id="btn-end-home" aria-label="Home"><span data-icon="home"></span></button><button class="act next" id="btn-end-more" aria-label="Another round"><span data-icon="next"></span></button></div></div>
</section>
<section class="screen" id="s-alldone">
  <div class="center"><div class="bigkite"><span data-icon="kiteHigh"></span></div><h1>All done for today.</h1><p>Reading time is finished. Go read a real book with someone.</p><button class="act hear" id="btn-alldone-home" aria-label="Home"><span data-icon="home"></span></button></div>
</section>
<section class="screen" id="s-parent">

    <div class="tabs"><button class="tab on" data-pane="how">How to play</button><button class="tab" data-pane="progress">Progress</button><button class="tab" data-pane="settings">Settings</button></div>
    <div class="pane on" id="pane-how"></div><div class="pane" id="pane-progress"></div><div class="pane" id="pane-settings"></div>

</section>

async function onChoice(b,right){

  <div class="tipcard"><b>Picture to word (Medium and Hard)</b>A picture with three words (four at Hard) that differ by one letter, such as cat, cot, cut. The single-letter difference means every letter has to be read, not just the first one.</div>

  loadVoices(); const en=voices.filter(v=>/^en/i.test(v.lang));
  $('pane-settings').innerHTML=`<h2>Settings</h2>
  <div class="field"><label>Voice</label><select id="set-voice" style="font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%"><option value="">Automatic</option>${en.map(v=>`<option value="${v.name}" ${S.settings.voice===v.name?'selected':''}>${v.name} (${v.lang})</option>`).join('')}</select><button class="pbtn" id="set-test">Test: cat, hat, map</button></div>
  <div class="field"><label>Speed</label><input type="range" id="set-rate" min="0.6" max="1.1" step="0.05" value="${S.settings.rate}"><span class="note" id="set-rate-v">${S.settings.rate}</span></div>
  <div class="field"><label>Daily limit</label><button class="pbtn ${S.settings.limit?'on':''}" id="set-limit">${S.settings.limit?'On: five rounds or 20 minutes':'Off'}</button><span class="note">When on, play stops for the day after five rounds or twenty minutes.</span></div>
  <div class="field"><button class="pbtn" id="set-more">Allow one more round today</button><span class="note">${S.settings.limit&&S.today.done?'Today is marked finished.':'Today is not finished.'}</span></div>
  <h3>On the iPad</h3><p>Open this page in Safari, tap Share, then "Add to Home Screen." Progress stays on the device.</p>
  <h3>Data</h3><div class="field"><button class="pbtn warn" id="set-reset">Hold to erase everything</button></div>`;
  $('set-voice').addEventListener('change',e=>{ S.settings.voice=e.target.value; save(); });
  $('set-test').addEventListener('click',async()=>{ await speak('cat'); await wait(300); await speak('hat'); await wait(300); await speak('map'); });
  $('set-rate').addEventListener('input',e=>{ S.settings.rate=+e.target.value; $('set-rate-v').textContent=S.settings.rate; save(); });
  $('set-limit').addEventListener('click',()=>{ S.settings.limit=!S.settings.limit; if(!S.settings.limit) S.today.done=false; save(); renderSettings(); });
  $('set-more').addEventListener('click',()=>{ rollDay(); S.today.done=false; S.today.rounds=Math.min(S.today.rounds,4); S.today.ms=Math.min(S.today.ms,16*60*1000); save(); toast('One more round allowed.'); renderSettings(); });
  pointerHold($('set-reset'),3000,()=>{ localStorage.removeItem(KEY); S=JSON.parse(JSON.stringify(DEFAULT)); save(); toast('Erased.'); openParent(); });
}
rollDay(); renderHome(); show('s-home');
</script>

</body>
</html>
